- chunk_id: kyobo_tos_art19
  platform: Kyobo
  authority_level: Contract
  doc_title: "교보문고 이용약관"
  clause_ref: "제19조 (배송)"
  category: [Delivery]
  parent_context: "교보문고 재화의 배송 수단, 기간 및 비용 부담에 관한 기본 원칙"
  content: "회사는 이용자가 구매한 재화에 대해 배송수단, 수단별 배송비용 부담자, 수단별 배송기간 등을 명시합니다. 단, 회사의 고의 또는 과실로 약정 배송기간을 초과한 경우에는 그로 인한 이용자의 손해를 배상합니다."

- chunk_id: kyobo_tos_art20
  platform: Kyobo
  authority_level: Contract
  doc_title: "교보문고 이용약관"
  clause_ref: "제20조 (반품, 교환, 환불, 취소)"
  category: [Return, Refund, Cancellation]
  parent_context: "교보문고 단순변심 및 하자 발견 시 반품 기간과 비용 부담, 반품 불가 품목"
  content: |
    이용자는 상품을 배송받은 날로부터 7일 이내에 반품 또는 교환을 요청할 수 있습니다.
    재화 등의 내용이 표시·광고 내용과 다르거나 계약내용과 다르게 이행된 경우에는 그 사실을 안 날부터 30일 이내(늦어도 수령일로부터 3개월 이내) 청약철회를 할 수 있습니다.
    이용자의 단순변심 등 제2항에 해당하지 않는 사유로 배송된 재화를 반환하는 경우 반품 비용 및 발송비 일체를 이용자가 부담해야 합니다.
    이용자가 개봉한 소프트웨어 및 음반, 만화책 및 단시간 내에 필독이 가능한 잡지, 영상 화보집의 경우는 상품의 가치가 현저히 감소하여 재판매가 곤란하므로 반품 및 환불이 불가합니다.
    비닐 래핑이 있는 책은 래핑을 벗기지 않은 상태여야 반품이 가능합니다. 타 도서로 교환은 불가하며 반품 후 재주문해야 합니다.

- chunk_id: kyobo_tos_art20_overseas
  platform: Kyobo
  authority_level: Contract
  doc_title: "교보문고 이용약관"
  clause_ref: "제20조 제16항 [해외주문도서에 대한 특칙]"
  category: [Return, Refund, Overseas_Book]
  parent_context: "교보문고 해외주문도서 반품 및 취소 시 적용되는 수수료 비율"
  content: "해외주문 반품/취소 수수료는 서양도서의 경우 판매정가의 12%, 일본도서의 경우 판매정가의 7%를 적용합니다. 이는 이용자의 요청에 의한 개인주문상품이므로 단순 변심에 의한 반품/취소 시 위약금 성격으로 공제됩니다."

- chunk_id: kyobo_policy_delivery
  platform: Kyobo
  authority_level: Policy
  doc_title: "교보문고 배송 안내"
  clause_ref: "N/A"
  category: [Delivery, Dispatch]
  parent_context: "교보문고 무료배송 기준 금액 및 당일/새벽/바로드림 배송 서비스"
  content: |
    무료배송 기준: 일반/외국도서 15,000원 이상 (미만 2,500원 부과). 만화/잡지 15,000원, 핫트랙스 음반/DVD 20,000원 이상.
    배송 서비스:
    당일 배송: 평일 낮 12시 주문 시 당일 배송.
    새벽 배송: 평일 밤 10시 주문 시 다음 날 새벽 배송.
    휴일 배송: 토요일 저녁 8시 주문 시 주말/휴일 배송.
    바로드림: 온라인 가격 주문 후 매장 즉시 픽업.
    전담 택배사: CJ대한통운 (기본), 한진택배 (일부 매장).

- chunk_id: yes24_tos_art13
  platform: YES24
  authority_level: Contract
  doc_title: "예스24 서비스 이용약관"
  clause_ref: "제13조 (배송)"
  category: [Delivery, Delay_Compensation]
