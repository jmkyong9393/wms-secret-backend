- chunk_id: gmarket_buyer_tos_art14_delivery
  platform: Gmarket
  authority_level: Contract
  doc_title: "G마켓 구매회원 약관"
  clause_ref: "제14조 (배송)"
  category: [Delivery, Dispatch, Purchase_Confirmation]
  parent_context: "G마켓 구매회원 기준 배송 소요기간, 판매자 발송 조치 안내 및 자동 배송완료 전환 기준"
  content: |
    배송 소요기간: 입금 또는 대금결제 확인일의 익일을 기산일로 하여 배송 완료까지의 기간을 말합니다.
    발송 조치: 회사는 판매자에게 구매자의 입금 또는 대금결제 확인 통지를 받은 후 3영업일 이내 배송에 필요한 조치를 취하도록 안내합니다.
    배송 분쟁: 판매자, 구매자, 배송업체, 금융기관 사이의 배송 관련 분쟁은 당사자 간 해결을 원칙으로 하며 회사는 책임을 부담하지 않습니다.
    자동 배송완료: 판매자의 발송확인 처리 후 구매자의 수취확인이 지연될 경우 회사 안내 후 일정 기간이 지나면 자동으로 배송완료로 전환될 수 있으며, 실제 미수령 시 구매자는 미수취신고를 할 수 있습니다.

- chunk_id: gmarket_buyer_tos_art15_cancellation
  platform: Gmarket
  authority_level: Contract
  doc_title: "G마켓 구매회원 약관"
  clause_ref: "제15조 (취소)"
  category: [Cancellation, Refund, Return]
  parent_context: "G마켓 구매회원 기준 발송 전 취소, 배송중 반품절차 전환 및 취소 환불 기준"
  content: |
    발송 전 취소: 회원은 구매한 상품이 발송되기 전까지 구매를 취소할 수 있습니다.
    배송중 처리: 상품이 이미 배송중인 경우에는 취소가 아니라 반품절차에 따라 처리됩니다.
    배송준비 중 발송 완료: 배송준비 상태에서 취소신청했더라도 이미 상품이 발송된 경우에는 발송된 상품의 왕복배송비를 구매자가 부담하는 것을 원칙으로 하며 반품절차로 처리됩니다.
    취소 환불: 카드결제는 취소절차 완료 즉시 결제가 취소되고, 현금결제는 3영업일 이내 환불예정금으로 환불됩니다.

- chunk_id: gmarket_buyer_tos_art16_return
  platform: Gmarket
  authority_level: Contract
  doc_title: "G마켓 구매회원 약관"
  clause_ref: "제16조 (반품)"
  category: [Return, Refund, Shipping_Fee]
  parent_context: "G마켓 구매회원 기준 반품 신청 기간, 귀책사유별 반품 비용 부담 및 반품 환불 기준"
  content: |
    반품 기간: 회원은 판매자의 상품 발송 시로부터 배송완료일 후 7일 이내까지 관계법령에 따라 반품을 신청할 수 있습니다.
    법령 우선: 반품에 관한 일반 사항은 전자상거래 등에서의 소비자보호에 관한 법률 등 관련 법령이 판매자가 제시한 조건보다 우선합니다.
    비용 부담: 반품 비용은 반품에 대한 귀책사유가 있는 자에게 일반적으로 귀속됩니다. 단순변심은 구매자 부담, 상품하자는 판매자 부담으로 볼 수 있습니다.
    처리 지연 사유: 반품송장번호를 기재하지 않거나 반품사유를 판매자에게 정확히 통보하지 않으면 반품처리 및 환불이 지연될 수 있습니다.
    환불 기준: 반품 상품이 판매자에게 도착하고 반품사유 및 반품배송비 부담자가 확인된 이후 현금결제는 3영업일 이내 환불예정금으로 환불되고 카드결제는 즉시 취소됩니다.
    배송비 미결제: 구매자가 반품배송비를 부담해야 하는 경우 추가 결제가 이루어지지 않으면 환불이 지연될 수 있습니다.

- chunk_id: gmarket_buyer_tos_art17_exchange
  platform: Gmarket
  authority_level: Contract
  doc_title: "G마켓 구매회원 약관"
  clause_ref: "제17조 (교환)"
  category: [Exchange, Return, Shipping_Fee]
  parent_context: "G마켓 구매회원 기준 교환 신청 기간, 재고 부족 시 반품 전환 및 교환 비용 부담"
  content: |
    교환 기간: 회원은 판매자의 상품 발송 시로부터 배송완료일 후 7일 이내까지 관계법령에 따라 교환을 신청할 수 있습니다.
    재고 부족: 교환신청을 하더라도 판매자에게 교환할 물품의 재고가 없는 경우 교환은 불가능하며 해당 교환신청은 반품으로 처리됩니다.
    비용 부담: 물품하자의 경우 판매자가 왕복배송비를 부담하고, 구매자의 변심에 의한 경우에는 구매자가 교환 비용을 부담합니다.

- chunk_id: gmarket_buyer_tos_art18_refund
  platform: Gmarket
  authority_level: Contract
  doc_title: "G마켓 구매회원 약관"
  clause_ref: "제18조 (환불)"
  category: [Refund, Payment]
  parent_context: "G마켓 구매회원 기준 취소 또는 반품으로 환불 사유가 발생한 경우 결제수단별 환불 처리"
  content: |
    환불 발생: 구매자의 취소 또는 반품에 의하여 환불사유가 발생한 경우 환불 처리가 진행됩니다.
    현금결제: 현금결제의 경우 3영업일 이내 구매자의 환불예정금으로 해당 금액을 환불합니다.
    카드결제: 카드결제의 경우 즉시 결제가 취소되며, 카드결제를 통한 구매건의 환불은 원칙적으로 카드결제 취소를 통해서만 가능합니다.
    출금 요청: 회원은 환불예정금으로 환불된 금액을 별도로 지정한 자신의 출금계좌로 현금출금 요청할 수 있습니다.

- chunk_id: gmarket_buyer_tos_art19_exclusion
  platform: Gmarket
  authority_level: Contract
  doc_title: "G마켓 구매회원 약관"
  clause_ref: "제19조 (반품/교환/환불의 적용 배제)"
  category: [Return, Exchange, Refund, Exception]
  parent_context: "G마켓 구매회원 기준 반품, 교환, 환불 요청이 제한되는 적용 배제 사유"
  content: |
    적용 배제: 구매자는 약관에서 정한 특정 사유에 해당하는 경우 환불 또는 교환을 요청할 수 없습니다.
    구매자 귀책 훼손: 구매자의 귀책사유로 상품이 멸실 또는 훼손된 경우 환불 또는 교환 요청이 제한됩니다.
    사용 또는 소비: 구매자의 사용 또는 일부 소비로 상품 가치가 현저히 감소한 경우 환불 또는 교환 요청이 제한됩니다.
    시간 경과: 시간의 경과로 재판매가 곤란할 정도로 상품 가치가 현저히 감소한 경우 환불 또는 교환 요청이 제한됩니다.
    복제 가능 상품: 복제가 가능한 상품의 포장을 훼손한 경우 환불 또는 교환 요청이 제한됩니다.
    주문제작 상품: 주문에 따라 개별 생산되는 물품 등 판매자에게 회복할 수 없는 중대한 피해가 예상되고 사전 고지 및 구매자 동의가 있는 경우 환불 또는 교환 요청이 제한될 수 있습니다.

- chunk_id: gmarket_buyer_tos_art20_purchase_safety
  platform: Gmarket
  authority_level: Contract
  doc_title: "G마켓 구매회원 약관"
  clause_ref: "제20조 (구매안전 서비스)"
  category: [Settlement, Purchase_Confirmation, Refund]
  parent_context: "G마켓 구매회원 기준 결제대금 예치, 구매결정 및 취소/반품/교환/환불 의사표시 시 지급 보류"
  content: |
    구매안전 서비스: 회사는 선지급식 통신판매에서 구매자의 결제대금을 예치하고 배송 완료 후 재화 또는 용역 대금을 판매자에게 지급하여 구매자의 안전을 도모합니다.
    구매결정 요청: 회사는 구매자에게 배송완료일로부터 3영업일 이내 상품 공급 사실을 통보하도록 요청합니다.
    판매대금 지급: 구매자가 구매결정을 클릭하거나 배송완료일 후 일정 기간 내 구매결정을 클릭하지 않으면 회사는 약관 기준에 따라 판매회원에게 결제대금을 지급할 수 있습니다.
    지급 보류: 판매회원에게 결제대금을 지급하기 이전에 구매자가 취소, 반품, 교환 또는 환불 의사를 표시한 경우 회사는 지급을 보류합니다.

- chunk_id: gmarket_seller_tos_art15_delivery
  platform: Gmarket
  authority_level: Contract
  doc_title: "G마켓 판매회원 약관"
  clause_ref: "제15조 (상품의 배송)"
  category: [Delivery, Dispatch, Seller_Obligation, Packaging]
  parent_context: "G마켓 판매회원 기준 주문정보 확인, 포장, 발송기한 및 송장 입력 의무"
  content: |
    주문정보 확인: 구매자의 주문에 따른 결제가 완료되면 회사는 판매회원이 주문정보를 확인할 수 있도록 조치하고, 판매회원은 해당 주문정보에 따라 배송해야 합니다.
    포장 의무: 판매회원은 배송 중 상품이 파손되지 않도록 적절히 포장한 후 배송 증명 또는 추적이 가능한 물류대행업체에 배송을 위탁해야 합니다.
    발송 기한: 판매회원은 구매자의 결제일로부터 3영업일 이내 상품 발송을 완료해야 합니다.
    발송 증명: 판매회원은 ESM PLUS에 송장번호 등 발송 관련 데이터를 입력하여 발송 완료를 증명해야 합니다.
    지연 제재: 기한 내 발송하지 않은 경우 상품 판매 제한, 옵션 판매 제한, 물품 및 옵션 등록 가능 개수 제한 등의 패널티를 받을 수 있습니다.

- chunk_id: gmarket_seller_tos_art16_delivery_obligation
  platform: Gmarket
  authority_level: Contract
  doc_title: "G마켓 판매회원 약관"
  clause_ref: "제16조 (판매회원의 배송 의무)"
  category: [Delivery, Dispatch, Cancellation, Seller_Obligation]
  parent_context: "G마켓 판매회원 기준 발송예정일 입력, 발송 전 취소 확인, 주문확인 미입력 시 환불 위험"
  content: |
    발송 데이터 입력: 주문을 확인한 판매회원은 ESM PLUS를 통하여 발송예정일 및 발송 관련 데이터를 입력해야 합니다.
    발송 전 취소 확인: 판매회원은 상품을 발송하기 전에 주문확인을 통해 주문이 취소되었는지 최종 확인해야 합니다.
    미입력 위험: 상품발송 후 주문확인 미입력 건에 대해 구매자가 G마켓으로 취소요청을 하는 경우 판매회원에게 통보 없이 주문이 취소되어 구매자에게 환불될 수 있으며, 상품회수 비용은 판매회원이 부담합니다.
    자동 환불: 주문 확인 후 발송예정일을 입력하지 않은 상태로 2주 이상 경과하면 주문 건은 자동 환불될 수 있습니다.
    판매거부 제재: 상품을 발송하지 않아 거래가 취소되는 경우 회사는 판매회원에게 판매거부로 인한 불이익을 줄 수 있습니다.

- chunk_id: gmarket_seller_tos_art18_cancel_return
  platform: Gmarket
  authority_level: Contract
  doc_title: "G마켓 판매회원 약관"
  clause_ref: "제18조 (취소 및 반품)"
  category: [Cancellation, Return, Refund, Seller_Obligation, Shipping_Fee]
  parent_context: "G마켓 판매회원 기준 취소, 반품, 자동환불, 반품 배송비 부담 및 부당반품거부 제재"
  content: |
    공급 곤란 시 취소: 판매회원은 구매자가 주문한 상품 공급이 곤란하다는 것을 알았을 때 즉시 구매자와 회사에 통보하고 구매자 동의를 얻은 후 취소해야 하며, 회사가 3일 이내 환불 조치를 할 수 있도록 해야 합니다.
    주문확인 후 취소요청: 주문확인 후 취소 요청 건에 대해 24시간 이내 환불처리나 발송확인 처리를 하지 않으면 주문 건은 자동 환불처리됩니다. 단, 배송중인 경우에는 취소가 아니라 반품절차에 따릅니다.
    반품 환불기한: 판매회원은 반품상품 수령일로부터 3영업일 이내 환불 또는 환불에 필요한 조치를 취해야 합니다.
    환불유보 제한: 반품배송비 청구로 환불유보를 하더라도 반품상품 수령일로부터 5일 이내 환불 조치를 취해야 하며, 클레임 발생 시 패널티가 부과될 수 있습니다.
    하자/오배송 배송비: 판매회원이 상품하자나 오배송 등을 인정한 상태에서는 구매자에게 반품 또는 교환 배송비를 부담시켜서는 안 됩니다.
    구매자 요청 처리: 구매자는 배송완료일 후 7일 이내 반품 또는 교환 요청을 할 수 있으며, 판매회원은 법령상 예외 사유가 없는 한 요청에 따라 처리해야 합니다.
    표시광고 상이: 상품이 표시 또는 광고 내용과 다른 경우 상품수령 후 90일 이내 및 그 사실을 안 날 또는 알 수 있었던 날부터 30일 이내 요청에 따라 반품 또는 교환 처리해야 합니다.
    부당 거부 금지: 판매회원은 반품신청을 수시로 확인해야 하며, 확인하지 못한 것을 이유로 반품을 거부해서는 안 됩니다.

- chunk_id: gmarket_seller_tos_art19_exchange_refund
  platform: Gmarket
  authority_level: Contract
  doc_title: "G마켓 판매회원 약관"
  clause_ref: "제19조 (교환 및 환불)"
  category: [Exchange, Refund, Recall, Seller_Obligation, Shipping_Fee]
  parent_context: "G마켓 판매회원 기준 교환/환불 처리, 비용 부담 주체, 리콜 및 청약철회 불가 상품 고지"
  content: |
    교환/환불 처리: 구매자가 상품 수령 후 교환이나 환불을 요청하는 경우 판매회원은 관련 법률에 따라 반품을 받은 후 교환 또는 환불을 해주어야 합니다.
    비용 부담: 교환이나 환불로 추가 발생하는 비용은 교환이나 환불의 책임이 있는 측에서 부담합니다.
    빠른환불 정산: 회사는 구매회원이 반품을 위해 상품을 발송한 사실이 확인되면 판매회원의 반품수령확인 전이라도 구매회원에게 빠른환불서비스를 제공할 수 있으며, 정당한 사유 없는 환불로 확인되면 판매회원에게 환불액을 정산합니다.
    리콜 의무: 상품 하자 또는 사용상 안전성에 결함이 있는 경우 판매회원은 전량 리콜, 수리, 교환, 환불을 해야 하며 리콜 비용을 부담해야 합니다.
    청약철회 불가 고지: 청약철회가 불가능한 상품은 상품 상세페이지에 명시하고 배송 시 포장 또는 소비자가 쉽게 알 수 있는 곳에 명기해야 합니다.
    분쟁 협력: 주문 취소, 환불 등에 대한 분쟁 발생 시 회사는 소비자분쟁해결기준에 근거하여 합의가 이루어질 수 있도록 협력합니다.

- chunk_id: auction_tos_art24_delivery
  platform: Auction
  authority_level: Contract
  doc_title: "옥션 이용약관"
  clause_ref: "제24조 (배송)"
  category: [Delivery, Dispatch, Seller_Obligation, Packaging]
  parent_context: "옥션 판매자 기준 발송정보 입력, 3영업일 내 발송, 배송증명 및 배송 중 위험 부담"
  content: |
    발송정보 입력: 판매자는 주문이 접수되면 ESM PLUS 서비스화면에 발주를 확인하거나 발송예정일, 발송일, 택배사, 송장번호 등 발송 관련 정보를 입력해야 합니다.
    지연 통지: 물품발송이 지연될 가능성이 있는 경우 판매자는 이를 구매자에게 통지해야 합니다.
    발송 기한: 판매자는 전자상거래법에 따라 구매자의 결제일로부터 3영업일 이내 상품 발송을 완료해야 합니다.
    발송 전 취소 확인: 판매자는 물품발송 전에 구매자가 주문 또는 결제를 취소하지 않았는지 확인해야 합니다.
    발송 증명: 판매자는 송장번호 등 발송 관련 데이터를 입력하여 발송 완료를 증명해야 합니다.
    배송추적 불가: 발송 관련 데이터를 입력하지 않았거나 부정확한 정보로 배송 증명 또는 추적이 불가능한 경우 회사는 구매자 요청에 따라 주문을 취소하고 환불할 수 있습니다.
    배송 위험 부담: 판매자가 물품을 배송할 경우 구매자가 물품을 수령하기까지의 위험은 판매자가 부담하며, 판매자는 하자 없는 물품 수령을 위해 포장, 운송업체 선정 등 필요한 조치를 해야 합니다.

- chunk_id: auction_tos_art26_cancel_before_shipping
  platform: Auction
  authority_level: Contract
  doc_title: "옥션 이용약관"
  clause_ref: "제26조 가~다 (취소)"
  category: [Cancellation, Refund]
  parent_context: "옥션 기준 입금 또는 대금결제 통지 전 취소, 발송 전 취소 및 발송 후 반품절차 전환"
  content: |
    통지 전 취소: 판매자가 구매자의 입금 또는 대금결제 통지를 수령하기 전에 구매자가 주문 또는 결제를 취소한 경우 해당 경매는 자동 취소되고 입금된 대금은 구매자에게 환불됩니다.
    구매쿠폰 미승인: 판매자가 ESM PLUS 서비스화면에서 에누리쿠폰 적용을 승인하지 않으면 해당 경매는 자동 취소되고 입금된 대금은 구매자에게 환불됩니다.
    발송 전 취소: 판매자가 물품발송표시를 하기 전에 구매자가 주문 또는 결제를 취소한 경우, 취소 이전에 물품을 발송하지 않은 판매자는 구매자의 취소를 승인해야 합니다.
    자동 취소: 판매자가 구매자의 취소 시로부터 24시간 이내 취소 승인 또는 취소일 이전 발송일이 표시된 물품발송표시를 하지 않는 경우 해당 경매는 자동 취소되고 대금은 환불됩니다.
    발송 후 처리: 물품이 발송된 이후의 취소와 대금환불은 취소가 아니라 반품절차에 따릅니다.

- chunk_id: auction_tos_art26_non_receipt
  platform: Auction
  authority_level: Contract
  doc_title: "옥션 이용약관"
  clause_ref: "제26조 라 (물품 미수령)"
  category: [Delivery, Refund, Non_Receipt]
  parent_context: "옥션 기준 물품 미수령 통지, 판매자의 도착 증빙 및 환불 처리"
  content: |
    미수령 통지: 구매자는 물품을 수령하지 못한 경우 판매자가 표시한 물품발송일로부터 15일 이내 회사에 물품미수령 통지를 해야 합니다.
    판매자 통지: 회사는 물품미도착 사실을 판매자에게 서비스화면 또는 이메일 등으로 통지합니다.
    도착 증빙 실패: 판매자가 물품도착증빙을 제공하지 못하는 경우 회사는 입금된 대금을 구매자에게 환불합니다.
    철회 요청: 물품도착증빙을 제공한 판매자는 구매자의 물품미수령신고 철회를 요청할 수 있으며, 고지 후 7일 이내 구매자가 이의를 제기하지 않으면 물품 판매대금이 판매자에게 송금될 수 있습니다.

- chunk_id: auction_tos_art26_return_exchange
  platform: Auction
  authority_level: Contract
  doc_title: "옥션 이용약관"
  clause_ref: "제26조 마~바 (반품 및 교환)"
  category: [Return, Exchange, Exception, Settlement]
  parent_context: "옥션 기준 반품/교환 요청 기간, 제한 사유, 교환 1회 제한 및 대금 송금 보류"
  content: |
    반품/교환 기간: 구매자는 물품발송일로부터 물품을 수령한 후 7일 이내까지 회사에 반품 또는 교환을 요청할 수 있습니다. 물품등록정보에 그 이상의 기간이 게시되어 있는 경우에는 그 기간 내 요청할 수 있습니다.
    제한 사유: 구매자의 귀책사유로 물품이 훼손된 경우, 사용 또는 일부 소비로 가치가 현저히 감소한 경우, 시간 경과로 재판매가 곤란한 경우, 복제 가능한 물품의 포장을 훼손한 경우, 주문제작 물품 등 사전 고지 및 동의가 있는 경우, 기타 법령상 제한 사유가 있는 경우 반품 또는 교환이 제한됩니다.
    교환 제한: 교환은 1회에 한하여 허용됩니다.
    반품 전환: 물품 판매 시 교환 제한을 명시적으로 고지했거나, 교환 신청 시 교환 재고가 없는 경우 해당 교환 신청은 반품으로 처리됩니다.
    반환 의무: 구매자는 교환 또는 반품하려는 경우 판매자에게 통지하고 수령한 물품을 판매자에게 반환해야 하며, 회사 서비스 화면에도 교환 또는 반품 요청 사실을 표시해야 합니다.
    송금 보류: 구매자가 교환 또는 반품을 요청한 경우 회사는 물품대금의 송금을 보류합니다. 다만 교환/반품 제한 사유가 입증되면 구매결정 여부와 관계없이 판매자에게 물품대금을 송금할 수 있습니다.

- chunk_id: auction_tos_art26_fee_hold_refund
  platform: Auction
  authority_level: Contract
  doc_title: "옥션 이용약관"
  clause_ref: "제26조 사~아 (운송료 및 반품/교환 보류)"
  category: [Return, Exchange, Refund, Shipping_Fee, Settlement]
  parent_context: "옥션 기준 반품/교환 운송료 부담, 판매자의 보류 통지 및 비용 정산 후 환불 처리"
  content: |
    운송료 부담: 반품 또는 교환 시 소요되는 운송료는 반품 또는 교환의 원인을 제공한 자가 부담하는 것을 원칙으로 합니다.
    판매자 조치: 구매자로부터 물품을 반환받은 판매자는 반품 또는 교환에 필요한 조치를 취해야 합니다.
    보류 통지: 판매자는 배송비 정산, 물품 및 부속품/종물/사은품 반환 확인, 반품/교환 부적합 판단 등의 사유가 있는 경우 회사에 반품 또는 교환 보류 의사를 통지할 수 있습니다.
    배송비 정산 후 처리: 판매자가 배송비 정산을 이유로 보류 의사를 통지한 경우, 구매자가 배송비 정산을 완료하면 회사는 반품의 경우 3영업일 이내 환불 또는 교환에 필요한 조치를 취합니다.
    분쟁 보류: 배송비 외 사유로 보류 의사가 통지된 경우 회사는 구매자 환불을 보류하고, 구매자와 판매자 간 분쟁이 완료되면 그 결과에 따라 환불 또는 송금 등의 조치를 취합니다.

- chunk_id: gsshop_tos_art13_order_change_cancel
  platform: GSSHOP
  authority_level: Contract
  doc_title: "GS SHOP 이용약관"
  clause_ref: "제13조(수신확인통지·구매신청 변경 및 취소)"
  category: [Cancellation, Order_Change, Refund]
  parent_context: "GS SHOP 구매신청 변경 및 배송 전 주문 취소 처리 기준"
  content: |
    GS SHOP 이용약관 제13조는 이용자의 구매신청 후 수신확인통지, 구매신청 변경 및 취소 절차를 규정한다.
    수신확인통지를 받은 이용자는 의사표시의 불일치 등이 있는 경우 즉시 구매신청 변경 및 취소를 요청할 수 있다.
    몰은 배송 전에 이용자의 요청이 있는 경우 지체 없이 그 요청에 따라 처리하여야 한다.
    다만 이미 대금을 지불한 경우에는 제16조의 청약철회 등에 관한 규정에 따른다.

- chunk_id: gsshop_tos_art14_supply_delivery
  platform: GSSHOP
  authority_level: Contract
  doc_title: "GS SHOP 이용약관"
  clause_ref: "제14조(재화 등의 공급)"
  category: [Delivery, Dispatch, Shipping_Fee]
  parent_context: "GS SHOP 재화 등의 공급, 배송 조치, 배송비용 및 배송기간 명시 기준"
  content: |
    GS SHOP 이용약관 제14조는 재화 등의 공급 및 배송 기준을 규정한다.
    몰은 이용자와 재화 등의 공급시기에 관하여 별도의 약정이 없는 이상, 이용자가 청약을 한 날부터 7일 이내에 재화 등을 배송할 수 있도록 주문제작, 포장 등 필요한 조치를 취한다.
    몰이 이미 재화 등의 대금 전부 또는 일부를 받은 경우에는 대금을 받은 날부터 3영업일 이내에 필요한 조치를 취한다.
    몰은 이용자가 재화 등의 공급 절차 및 진행 사항을 확인할 수 있도록 적절한 조치를 하여야 한다.
    몰은 이용자가 구매한 재화에 대해 배송수단, 수단별 배송비용 부담자, 수단별 배송기간 등을 명시한다.
    약정 배송기간을 초과한 경우 몰은 그로 인한 이용자의 손해를 배상하여야 한다. 다만 몰이 고의 또는 과실이 없음을 입증한 경우에는 그러하지 아니하다.

- chunk_id: gsshop_tos_art15_out_of_stock_refund
  platform: GSSHOP
  authority_level: Contract
  doc_title: "GS SHOP 이용약관"
  clause_ref: "제15조(환급)"
  category: [Refund, Cancellation, Out_Of_Stock]
  parent_context: "GS SHOP 품절 등으로 재화 제공이 불가능한 경우 환급 처리 기준"
  content: |
    GS SHOP 이용약관 제15조는 품절 등으로 재화 등의 인도 또는 제공이 불가능한 경우의 환급 기준을 규정한다.
    몰은 이용자가 구매신청한 재화 등이 품절 등의 사유로 인도 또는 제공될 수 없을 때에는 지체 없이 그 사유를 이용자에게 통지하여야 한다.
    사전에 재화 등의 대금을 받은 경우에는 대금을 받은 날부터 3영업일 이내에 환급하거나 환급에 필요한 조치를 취하여야 한다.
    도서 WMS에서는 실제 재고와 가상 재고가 불일치하여 출고가 불가능한 경우, 주문 취소 및 환급 처리 판단에 본 조항을 참고한다.

- chunk_id: gsshop_tos_art16_withdrawal_period
  platform: GSSHOP
  authority_level: Contract
  doc_title: "GS SHOP 이용약관"
  clause_ref: "제16조(청약철회 등) 제1항"
  category: [Return, Exchange, Cancellation, Book_Return]
  parent_context: "GS SHOP 재화 구매계약의 청약철회 가능 기간 및 서적 청약철회 기간 기준"
  content: |
    GS SHOP 이용약관 제16조 제1항은 재화 등의 구매계약에 대한 청약철회 가능 기간을 규정한다.
    이용자는 수신확인의 통지를 받은 날부터 30일 이내 청약철회를 할 수 있다.
    다만 의류, 보석, 서적, 패션잡화, 컴퓨터, 디지털기기는 15일, 핸드폰은 14일 이내 청약철회가 가능하다.
    몰이 청약철회의 기간을 달리 정하여 미리 이용자에게 고지하는 경우에도, 이용자는 자신에게 가장 유리한 조건으로 적용된 해당 기간 내에 청약을 철회할 수 있다.
    도서 WMS에서는 서적 상품의 반품 가능 기간을 판단할 때 본 조항을 우선 참고한다.

- chunk_id: gsshop_tos_art16_withdrawal_exclusion
  platform: GSSHOP
  authority_level: Contract
  doc_title: "GS SHOP 이용약관"
  clause_ref: "제16조(청약철회 등) 제2항~제3항"
  category: [Return, Exchange, Refund, Exception]
  parent_context: "GS SHOP 청약철회 및 교환 제한 사유"
  content: |
    GS SHOP 이용약관 제16조 제2항은 이용자가 재화 등을 배송받은 후 청약철회 및 교환을 할 수 없는 사유를 규정한다.
    이용자에게 책임 있는 사유로 재화 등이 멸실 또는 훼손된 경우에는 청약철회 및 교환이 제한된다. 다만 재화 등의 내용을 확인하기 위하여 포장 등을 훼손한 경우에는 청약철회를 할 수 있다.
    이용자의 사용 또는 일부 소비에 의하여 재화 등의 가치가 현저히 감소한 경우, 시간의 경과로 재판매가 곤란할 정도로 가치가 현저히 감소한 경우, 복제 가능한 재화 등의 원본 포장이 훼손된 경우에도 청약철회 및 교환이 제한된다.
    몰이 특정 재화 등에 대하여 청약철회 제한에 관해 사전에 고지한 경우에도 제한될 수 있다.
    다만 몰이 청약철회 제한 사실을 소비자가 쉽게 알 수 있는 곳에 명기하거나 시용상품을 제공하는 등의 조치를 하지 않았다면 이용자의 청약철회 등이 제한되지 않는다.
    도서 WMS에서는 내지 낙서, 물젖음, 찢김, 곰팡이, 구성품 누락, 부록 훼손, 포장 훼손 등이 구매자 귀책 훼손 또는 재판매 곤란 사유에 해당하는지 판단할 때 본 조항을 참고한다.

- chunk_id: gsshop_tos_art16_misdescription_withdrawal
  platform: GSSHOP
  authority_level: Contract
  doc_title: "GS SHOP 이용약관"
  clause_ref: "제16조(청약철회 등) 제4항"
  category: [Return, Exchange, Refund, Wrong_Item, Misdescription]
  parent_context: "GS SHOP 표시·광고 내용과 다르거나 계약내용과 다르게 이행된 경우의 청약철회 기준"
  content: |
    GS SHOP 이용약관 제16조 제4항은 재화 등의 내용이 표시·광고 내용과 다르거나 계약내용과 다르게 이행된 경우의 청약철회 기준을 규정한다.
    이용자는 재화 등의 내용이 표시·광고 내용과 다르거나 계약내용과 다르게 이행된 때에는 재화 등을 공급받은 날부터 3개월 이내, 그 사실을 안 날 또는 알 수 있었던 날부터 30일 이내 청약철회 등을 할 수 있다.
    도서 WMS에서는 오배송, 다른 ISBN의 도서 발송, 설명과 다른 상태의 도서 발송, 구성품 누락 등 계약내용과 다른 이행 여부를 판단할 때 본 조항을 참고한다.

- chunk_id: gsshop_tos_art17_refund_effect
  platform: GSSHOP
  authority_level: Contract
  doc_title: "GS SHOP 이용약관"
  clause_ref: "제17조(청약철회 등의 효과) 제1항~제2항"
  category: [Refund, Payment_Cancel]
  parent_context: "GS SHOP 청약철회 후 대금 환급 및 결제 취소 처리 기준"
  content: |
    GS SHOP 이용약관 제17조 제1항과 제2항은 청약철회 후 환급 및 결제 취소 처리 기준을 규정한다.
    몰은 이용자로부터 재화 등을 반환받은 경우 3영업일 이내에 이미 지급받은 재화 등의 대금을 환급한다.
    몰이 환급을 지연한 경우에는 공정거래위원회가 고시하는 지연이자율에 따라 지연이자를 지급한다.
    이용자가 신용카드 또는 전자화폐 등의 결제수단으로 대금을 지급한 경우, 몰은 지체 없이 해당 결제수단 제공 사업자에게 대금 청구의 정지 또는 취소를 요청한다.

- chunk_id: gsshop_tos_art17_return_shipping_fee
  platform: GSSHOP
  authority_level: Contract
  doc_title: "GS SHOP 이용약관"
  clause_ref: "제17조(청약철회 등의 효과) 제3항~제4항"
  category: [Return, Exchange, Refund, Shipping_Fee, Liability]
  parent_context: "GS SHOP 청약철회 시 반품 배송비 및 귀책사유별 비용 부담 기준"
  content: |
    GS SHOP 이용약관 제17조 제3항과 제4항은 청약철회 시 반환 비용 부담 기준을 규정한다.
    청약철회 등의 경우 공급받은 재화 등의 반환에 필요한 비용은 이용자가 부담한다.
    몰은 이용자에게 청약철회를 이유로 위약금 또는 손해배상을 청구하지 않는다.
    다만 재화 등의 내용이 표시·광고 내용과 다르거나 계약내용과 다르게 이행되어 청약철회를 하는 경우, 재화 등의 반환에 필요한 비용은 몰이 부담한다.
    이용자가 재화 등을 제공받을 때 발송비를 부담한 경우, 몰은 청약철회 시 그 비용을 누가 부담하는지를 이용자가 알기 쉽도록 명확하게 표시한다.
    도서 WMS에서는 단순변심 반품인지, 오배송 또는 설명과 다른 도서 상태로 인한 반품인지에 따라 반품 배송비 부담 주체를 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_buyer_tos_art14_contract_out_of_stock
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 구매자 약관"
  clause_ref: "제14조 (매매계약의 체결 및 대금 결제)"
  category: [Cancellation, Refund, Out_Of_Stock, Payment]
  parent_context: "롯데ON 구매신청 승낙, 재고 없음, 가격 변동, 결제 오류 및 계약 취소 기준"
  content: |
    롯데ON 구매자 약관 제14조는 매매계약의 체결 및 대금 결제 기준을 규정한다.
    상품 등의 매매계약은 구매회원의 구매신청에 대하여 회사 또는 판매회원이 승낙의 의사표시를 함으로써 체결된다.
    회사 또는 판매회원은 시스템 오류 등으로 재고가 없는 상품에 대한 구매신청이 발생하였거나, 현저한 가격 변동 등으로 구매신청 가격으로 상품 등을 공급하는 것이 불가능한 경우 구매신청을 승낙하지 않을 수 있다.
    구매회원이 상품 등을 주문한 후 일정 기간 내에 구매대금을 결제하지 않을 경우, 회사는 해당 주문을 구매회원의 동의 없이 취소할 수 있다.
    회사는 매매계약의 취소 방법 및 절차를 안내하며, 결제수단의 정당한 사용권한 확인이 완료될 때까지 거래 진행을 중지하거나 확인이 불가한 거래를 취소할 수 있다.
    도서 WMS에서는 가상 재고와 실제 재고가 불일치하거나 결제·재고 오류로 출고가 불가능한 경우, 주문 취소 또는 환불 처리 판단에 본 조항을 참고한다.

- chunk_id: lotteon_buyer_tos_art15_delivery
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 구매자 약관"
  clause_ref: "제15조 (배송)"
  category: [Delivery, Dispatch, Purchase_Confirmation]
  parent_context: "롯데ON 배송 소요기간, 판매회원 배송 조치, 자동 배송완료 및 미수취 신고 기준"
  content: |
    롯데ON 구매자 약관 제15조는 배송 기준을 규정한다.
    배송 소요기간은 입금 또는 대금결제 확인일의 익일을 기산일로 하여 배송이 완료되기까지의 기간을 의미한다.
    회사는 판매회원에게 회사로부터 구매회원의 입금 또는 대금결제에 대한 확인통지를 받은 후 3영업일 이내에 배송에 필요한 조치를 취하도록 안내한다.
    단, 구매회원과 상품 등의 공급시기에 관하여 별도의 약정이 있는 경우에는 그 약정에 따른다.
    천재지변 등 불가항력적인 사유가 발생한 경우 해당 기간은 배송 소요기간에서 제외된다.
    회사는 배송과 관련하여 판매회원, 구매회원, 배송업체, 금융기관 등 사이에 발생한 분쟁은 당사자들 간의 해결을 원칙으로 하며, 회사는 책임을 부담하지 않는다고 규정한다.
    판매회원의 발송확인 처리 이후 구매회원의 수취확인이 없어 배송중 상태가 지연될 경우, 회사는 발송확인일로부터 2주 이내에 수취확인요청 안내를 할 수 있다.
    안내 이후에도 수취확인이 이루어지지 않으면 3일 경과 시점에 자동으로 배송완료로 전환될 수 있으며, 실제 상품을 수령하지 못한 구매회원은 미수취신고를 할 수 있다.
    도서 WMS에서는 배송중, 배송완료, 미수취, 자동 배송완료 상태를 판단하고 반품 가능 기간의 기준일을 산정할 때 본 조항을 참고한다.

- chunk_id: lotteon_buyer_tos_art16_cancellation
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 구매자 약관"
  clause_ref: "제16조 (취소)"
  category: [Cancellation, Refund, Dispatch]
  parent_context: "롯데ON 발송 전 취소, 배송중 반품절차 전환, 주문제작 상품 취소 제한 기준"
  content: |
    롯데ON 구매자 약관 제16조는 주문 취소 기준을 규정한다.
    구매회원은 구매한 상품 등이 발송되기 전까지 취소요청을 할 수 있다.
    배송중인 경우에는 취소요청이 아니라 반품절차에 따라 처리된다.
    구매회원이 취소요청한 상품 등이 실제로 배송이 시작되었거나 주문제작 또는 생산이 시작된 등 특별한 사정이 있는 경우, 판매회원은 구매회원의 취소요청을 거부하거나 보류할 수 있으며 이 경우 구매회원에게 별도로 고지한다.
    판매회원의 취소처리 거부나 보류 시 구매회원이 해당일로부터 1일 이내에 취소요청을 철회하지 않거나 판매회원과 구매회원 간 협의가 되지 않는 경우, 해당 취소요청은 자동으로 철회되고 상품 매매계약 내용대로 이행된다.
    구매회원의 취소처리 요청에 판매회원이 1일 내 응답하지 않은 경우 해당 상품 등의 매매계약은 즉시 취소처리된다.
    일부 상품은 약속한 발송 기일을 경과한 경우 구매회원의 별도 취소처리 요청이 없더라도 취소처리될 수 있다.
    상품 등의 매매계약 체결 이후에도 배송을 위한 정보가 충분하지 않거나 매장 수령 예정일 경과 등 정상적인 거래 이행이 불가능하다고 판단될 경우, 회사나 판매회원에 의해 매매계약이 취소처리될 수 있다.
    취소처리에 따른 환불은 제19조에 따라 처리한다.
    도서 WMS에서는 출고 전 취소인지, 출고 후 회수 및 반품 검수가 필요한 건인지 구분할 때 본 조항을 참고한다.

- chunk_id: lotteon_buyer_tos_art17_return_period
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 구매자 약관"
  clause_ref: "제17조 (반품) 제1항~제2항"
  category: [Return, Refund, Wrong_Item, Damage]
  parent_context: "롯데ON 상품 발송 이후 반품 가능 기간, 오배송·파손·표시광고 상이 상품의 반품 기준"
  content: |
    롯데ON 구매자 약관 제17조 제1항과 제2항은 반품 신청 가능 기간과 특별 반품 사유를 규정한다.
    구매회원은 판매회원의 상품 발송 이후부터 배송완료일 후 7일 이내까지 관계법령에 따라 반품을 신청할 수 있다.
    사이트에 발송 준비중으로 표시되더라도 실제로 발송이 이루어진 경우에는 반품 절차로 진행된다.
    배송된 상품 등이 주문내용과 상이하거나, 판매회원 또는 회사가 제공한 표시·광고 내용과 상이한 경우 구매회원은 상품을 공급받은 날부터 3개월 이내, 그 사실을 안 날 또는 알 수 있었던 날부터 30일 이내에 반품을 신청할 수 있다.
    상품 등이 파손, 손상되었거나 오염된 상태로 배송된 경우에도 위 기간 내 반품 신청이 가능하다.
    전자상거래법상 광고에 표시해야 할 사항을 표시하지 않은 상태에서 상품 등 매매계약이 체결된 경우에도 위 기간 내 반품 신청이 가능하다.
    단, 구매확정 이후에는 회사의 사이트나 서비스를 이용한 반품 처리가 이루어지지 않고 판매회원과 별도로 협의하여 진행된다.
    도서 WMS에서는 오배송, 다른 ISBN의 도서 발송, 파손·오염 상태 배송, 표시된 상태와 다른 중고 도서 발송 여부를 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_buyer_tos_art17_return_process_fee
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 구매자 약관"
  clause_ref: "제17조 (반품) 제3항~제11항"
  category: [Return, Refund, Shipping_Fee, Liability]
  parent_context: "롯데ON 반품 접수 거부·보류, 자동 접수, 귀책사유별 반품 비용 부담 및 환불 지연 기준"
  content: |
    롯데ON 구매자 약관 제17조 제3항부터 제11항은 반품 신청 처리 절차와 비용 부담 기준을 규정한다.
    구매회원이 반품 신청한 상품 등이 제20조의 반품/교환/환불 적용 배제 사유에 해당하는 경우, 판매회원은 반품 신청에 대하여 반품 접수를 거부하거나 보류할 수 있으며 이 경우 구매회원에게 별도로 고지한다.
    판매회원의 반품 접수 거부나 보류에 대해 구매회원은 다시 반품을 신청할 수 있으며, 반품 신청 시 자동 구매확정이 연기된다.
    판매회원의 반품 접수 거부나 보류 통지 시 구매회원이 해당일로부터 1일 이내에 반품을 재신청하지 않거나 협의가 지속적으로 완료되지 않는 경우, 해당 요청은 자동으로 철회되고 상품 매매계약 내용대로 이행된다.
    약속한 기일을 경과하거나 구매회원의 반품 신청 요청에 판매회원이 2영업일 이내에 응답하지 않은 경우, 해당 상품 등의 반품 신청은 자동으로 접수되고 회사는 환불에 필요한 조치를 이행한다.
    반품에 관한 일반적인 사항은 전자상거래 등에서의 소비자보호에 관한 법률 등 관련법령이 판매회원이 제시한 조건보다 우선한다.
    반품에 소요되는 비용은 반품에 대한 귀책사유가 있는 자에게 일반적으로 귀속된다. 예를 들어 단순변심은 구매회원 부담, 상품하자는 판매회원 부담이다.
    단, 당사자 간 별도 약정이 있는 경우에는 그 약정에 따른다.
    반품 상품 등의 배송방법은 상품 등의 종류와 부피 등을 고려하여 처리 가능한 방식에 따라 진행하여야 한다.
    반품처리에 따른 환불은 제19조에 따라 처리한다.
    반품 신청 시 반품사유를 판매회원에게 정확히 통보하지 않고 상품을 반환하거나 구매회원 부담의 반품배송비를 지불하지 않는 경우 반품처리 및 환불이 지연될 수 있다.
    도서 WMS에서는 단순변심 반품, 도서 하자 반품, 반품 배송비 부담 주체, 반품 접수 보류 및 자동 접수 여부를 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_buyer_tos_art18_exchange
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 구매자 약관"
  clause_ref: "제18조 (교환)"
  category: [Exchange, Return, Shipping_Fee, Liability]
  parent_context: "롯데ON 교환 신청 가능 기간, 동일 상품·동일 옵션 교환, 재고 부족 시 반품 처리 및 교환 비용 부담 기준"
  content: |
    롯데ON 구매자 약관 제18조는 교환 기준을 규정한다.
    구매회원은 판매회원의 상품 발송 시로부터 배송완료일 후 7일 이내까지 관계법령에 따라 교환을 신청할 수 있다.
    교환은 동일한 상품 및 동일한 옵션인 경우에만 가능하며, 그 외의 경우에는 반품 후 재구매 절차를 진행해야 한다.
    교환 신청을 하더라도 판매회원에게 교환할 물품의 재고가 없는 경우에는 교환이 불가능하며, 이 경우 해당 교환신청은 제17조를 준용하여 반품신청으로 처리된다.
    교환에 소요되는 비용은 교환에 대한 귀책사유가 있는 자에게 일반적으로 귀속된다.
    예를 들어 단순변심의 경우 구매회원이 부담하고, 상품하자의 경우 판매회원이 부담한다.
    단, 당사자 간 별도의 약정이 있는 경우에는 그 약정에 따른다.
    도서 WMS에서는 동일 도서·동일 옵션 교환 가능 여부, 재고 부족 시 반품 전환, 교환 배송비 부담 주체를 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_buyer_tos_art19_refund
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 구매자 약관"
  clause_ref: "제19조 (환불)"
  category: [Refund, Payment_Cancel, Partial_Refund]
  parent_context: "롯데ON 주문 취소 또는 반품 완료 후 환불 처리 기간, 결제수단별 환불 및 부분환불 기준"
  content: |
    롯데ON 구매자 약관 제19조는 환불 기준을 규정한다.
    상품 등의 주문 취소 또는 반품 완료 처리에 따라 구매회원에 대한 환불사유가 발생할 경우, 회사는 3영업일 이내에 이미 지급받은 상품 등의 대금을 환불하거나 환불에 필요한 조치를 취한다.
    회사가 환불을 지연한 경우에는 전자상거래 등에서의 소비자보호에 관한 법률 시행령이 정하는 지연이자율을 곱하여 산정한 지연이자를 지급한다.
    구매회원이 신용카드 또는 전자화폐 등의 결제수단으로 대금을 지급한 경우, 회사는 지체 없이 해당 결제수단 제공 사업자로 하여금 대금 청구를 정지 또는 취소하도록 요청한다.
    환불은 원칙적으로 구매회원이 지급한 결제수단을 통하여 진행한다.
    현금결제에 대한 환불은 주문 시 사전 입력한 계좌번호에 입금하는 방법으로 진행하며, 환불금액 또는 환불예정금액을 입금받지 않고 다른 상품 등을 주문하는 수단으로 사용할 수 없다.
    계좌번호 입력 오류, 이용불가 계좌, 결제수단 제공자의 사유 등으로 환불이 불가능한 경우에는 구매회원에게 개별 연락하여 확인 후 계좌입금하거나 환불예정금액으로 표시 및 보관한 뒤 추후 구매회원의 요청에 따라 계좌입금할 수 있다.
    부분 주문 취소 또는 부분 반품 시 환불되는 금액은 할인서비스의 적용 조건이 달라짐에 따라 구매회원이 예상한 금액과 다소 상이할 수 있다.
    도서 WMS에서는 반품 완료 후 환불 기한, 카드결제 취소, 현금결제 환불, 부분반품 환불 금액 산정 시 본 조항을 참고한다.

- chunk_id: lotteon_buyer_tos_art20_return_exchange_refund_exclusion
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 구매자 약관"
  clause_ref: "제20조 (반품/교환/환불의 적용 배제)"
  category: [Return, Exchange, Refund, Exception, Book_Return]
  parent_context: "롯데ON 반품·교환·환불 제한 및 청약철회 적용 배제 기준"
  content: |
    롯데ON 구매자 약관 제20조는 반품, 교환, 환불의 적용 배제 사유를 규정한다.
    단, 상품 불량 또는 표시·광고 내용과 상이한 경우에는 청약철회 제한이 적용되지 않는다.
    구매회원의 단순변심으로 인한 교환 또는 반품 요청이 상품 등을 수령한 날로부터 7일을 경과한 경우 청약철회가 제한될 수 있다.
    구매회원의 귀책사유로 상품이 멸실 또는 훼손된 경우 청약철회가 제한될 수 있다. 다만 상품 등의 내용을 확인하기 위하여 포장 등을 훼손한 경우에는 청약철회를 할 수 있다.
    구매회원의 사용 또는 일부 소비로 상품 가치가 현저히 감소한 경우 청약철회가 제한될 수 있다.
    신선식품 상품으로 상품 특성상 배송이 시작된 경우, 상품 불량인 경우를 제외하고 청약철회가 제한될 수 있다.
    시간의 경과로 재판매가 곤란할 정도로 상품 가치가 현저히 감소한 경우 청약철회가 제한될 수 있다.
    배송된 상품에 하자가 없음을 확인한 후 설치가 완료된 상품의 경우 청약철회가 제한될 수 있다.
    복제가 가능한 상품의 포장을 훼손한 경우 청약철회가 제한될 수 있으며, 예시로 CD, DVD, GAME, 서적 등의 경우 포장 개봉 시가 포함된다.
    주문에 따라 개별적으로 생산되는 물품 등 회사 또는 판매회원에게 회복할 수 없는 중대한 피해가 예상되는 경우로서 사전에 해당 거래에 대하여 별도로 고지하고 구매회원의 서면 또는 전자문서 동의를 받은 경우 청약철회가 제한될 수 있다.
    구매한 상품의 구성품 일부가 훼손되거나 누락된 경우 청약철회가 제한될 수 있다.
    기타 관련법령이 정하는 청약철회 제한사유에 해당하는 경우에도 제한될 수 있다.
    도서 WMS에서는 도서 포장 개봉, 구성품 누락, 부록 훼손, 내지 낙서, 물젖음, 찢김, 곰팡이, 재판매 곤란 여부를 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_buyer_tos_art21_purchase_safety
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 구매자 약관"
  clause_ref: "제21조 (구매안전서비스)"
  category: [Purchase_Safety, Refund, Return, Exchange, Payment_Hold]
  parent_context: "롯데ON 구매안전서비스, 결제대금 예치, 구매확정 및 취소·반품·교환·환불 의사표시 시 대금 지급 보류 기준"
  content: |
    롯데ON 구매자 약관 제21조는 구매안전서비스를 규정한다.
    회사는 선지급식 통신판매에서 결제대금예치사업자를 통해 구매회원이 지급하는 결제대금을 예치하고, 배송이 완료된 후 상품 또는 용역의 대금을 판매회원에게 지급함으로써 구매회원의 안전을 도모한다.
    회사는 구매회원에게 상품을 공급받은 사실을 배송완료일로부터 3영업일 이내에 회사 또는 판매회원에게 통보하도록 요청한다.
    구매회원이 상품 등을 공급받고 구매확정 의사를 표시한 경우, 결제대금예치사업자는 판매회원의 요청에 따라 결제대금을 지급한다.
    구매회원이 배송완료일로부터 7일 이내에 별도의 구매확정 의사표시나 보류 의사표시를 하지 않는 경우, 7일이 경과한 날로부터 회사는 판매회원이 결제대금 지급을 요청할 수 있도록 조치할 수 있다.
    다만 결제대금예치사업자가 판매회원에게 결제대금을 지급하기 이전에 구매회원이 취소, 반품, 교환 또는 환불의 의사를 표시한 경우에는 그 지급을 보류한다.
    도서 WMS에서는 구매확정 전 반품·교환·환불 요청 여부, 판매회원 대금 지급 보류 여부, 자동 구매확정과 반품 신청 타이밍을 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_buyer_tos_art26_overseas_direct_purchase
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 구매자 약관"
  clause_ref: "제26조 (해외직구 서비스)"
  category: [Overseas_Direct_Purchase, Cancellation, Return, Exchange, Refund]
  parent_context: "롯데ON 해외직구 상품의 주문 취소 제한 및 반품·교환·환불 준용 기준"
  content: |
    롯데ON 구매자 약관 제26조는 해외직구 서비스 기준을 규정한다.
    회사는 해외에 소재하는 판매회원이 상품을 등록하고 구매회원이 주문한 상품을 해외에서 국내로 배송하는 해외직구 서비스를 제공한다.
    해외직구 서비스를 통한 상품의 매매계약이 체결된 경우, 해외직구 서비스의 특성상 주문 취소가 제한될 수 있다.
    청약철회는 상품을 수령한 후 반품으로 진행될 수 있으며, 세부사항은 각 상품의 상세페이지 안내사항을 참고한다.
    해외직구 서비스를 통해 구매하는 상품의 반품, 교환, 환불에 대해서는 제17조부터 제20조의 규정을 준용한다.
    도서 WMS에서는 해외직구 도서의 주문 취소 제한, 수령 후 반품 전환, 반품·교환·환불 기준 적용 여부를 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art11_product_info_inventory
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제11조 (판매회원의 책임 및 관리의무)"
  category: [Seller_Obligation, Product_Info, Inventory, Listing]
  parent_context: "롯데ON 판매회원의 상품정보, 거래조건, 재고 수량, 상세 설명 최신화 의무"
  content: |
    롯데ON 판매회원 이용약관 제11조는 판매회원의 책임 및 관리의무를 규정한다.
    판매회원은 구매회원이 확인할 수 있도록 연락처, 주소 등의 정보를 정확하게 기재하여야 하며, 구매회원의 문의 등에 성실하고 정확하게 답변하여야 한다.
    판매회원은 상품 및 서비스, 거래조건에 관한 정보를 전자상거래 등에서의 소비자보호에 관한 법률 등 관련 법령과 약관에서 정한 방법에 따라 직접 등록하고 관리하여야 한다.
    판매회원은 상품에 특별한 거래조건이 있거나 추가 비용이 있는 경우 구매회원이 구매 전에 알 수 있도록 명확하게 기재하여야 한다.
    판매회원은 상품의 재고 수량 등 수시로 변동되는 정보 및 상품 상세 설명을 적절히 관리하고 최신 정보를 기재하여야 한다.
    부정확하거나 허위의 내용을 등록한 경우 회사는 판매회원에게 수정 요청하거나 판매 활동을 제한할 수 있다.
    도서 WMS에서는 도서 재고 수량, 도서 상태 설명, 부록 포함 여부, 추가 배송비, 반품 제한 조건 등 상품정보가 최신 상태인지 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art14_contract_delivery_obligation
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제14조 (상품 매매계약의 체결 및 배송)"
  category: [Delivery, Dispatch, Packaging, Seller_Obligation]
  parent_context: "롯데ON 판매회원의 상품 매매계약 체결, 3영업일 내 배송 조치, 포장 및 송장 입력 의무"
  content: |
    롯데ON 판매회원 이용약관 제14조는 상품 매매계약의 체결 및 배송 기준을 규정한다.
    구매회원이 주문에 대해 정상적으로 결제를 완료하면 회사는 판매회원이 해당 주문 정보를 판매자 센터 등에서 확인할 수 있도록 필요한 조치를 취한다.
    판매회원이 구매회원의 주문을 확인하고 발송의 표시를 할 때 상품 매매계약이 체결된 것으로 간주한다.
    판매회원은 구매회원의 결제일로부터 3영업일 이내에 상품 등의 공급을 위한 필요한 조치를 하여야 한다.
    단, 판매회원이 상품 등록정보에 명확하게 특이사항을 기재하였거나 구매회원과 판매회원 간 상품 공급 시기에 관한 별도 합의가 있는 경우에는 해당 기간 내에 발송을 진행하고 그 사실을 회사에 지체 없이 통보하여야 한다.
    판매회원은 배송 중 상품 등이 파손되지 않도록 적절한 포장을 하고 정확한 수취인 정보를 기재하여야 한다.
    판매회원은 배송추적 서비스를 제공하는 물류대행업체에 배송을 위탁하거나 직접 상품 등을 배송할 수 있다.
    물류대행업체에 배송을 위탁한 경우 판매회원은 송장번호 등 배송 관련 데이터를 판매자 센터 등에 입력하여 발송 완료를 증명하고, 구매회원이 배송 절차 및 현황을 확인할 수 있도록 조치하여야 한다.
    도서 WMS에서는 주문 도서의 출고 기한, 포장 책임, 배송추적 가능 여부, 송장 입력 여부를 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art14_delivery_failure_liability
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제14조 (상품 매매계약의 체결 및 배송) 제4항~제6항"
  category: [Delivery, Dispatch, Seller_Liability, Refund]
  parent_context: "롯데ON 판매회원의 배송 조치 미이행, 배송정보 오입력, 환불 및 패널티 기준"
  content: |
    롯데ON 판매회원 이용약관 제14조 제4항부터 제6항은 판매회원의 배송 조치 미이행 책임을 규정한다.
    판매회원이 결제일로부터 3영업일 이내에 배송에 필요한 조치를 취하지 않거나 배송정보 오입력 등으로 구매회원이 정상적으로 상품 등을 수취하지 못한 경우, 그에 관한 모든 책임은 판매회원이 부담한다.
    판매회원은 상품 등을 발송 완료한 시점부터 구매회원에게 배송이 완료되는 기간까지 통상적인 방법으로 구매회원이 상품 등을 수령할 수 있도록 필요한 조치를 취하여야 한다.
    판매회원이 배송에 필요한 조치를 이행하지 않는 경우 회사는 판매회원에게 패널티를 부과하고 해당 주문건에 대한 환불 처리 등 조치를 취할 수 있다.
    도서 WMS에서는 배송 지연, 송장 오류, 출고 누락, 미수령 클레임 발생 시 판매회원 책임 여부와 환불 처리 필요성을 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art15_shipping_data_dispute
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제15조 (판매회원의 배송정보 입력 및 분쟁 처리 의무)"
  category: [Delivery, Waybill, Shipping_Data, Dispute, Seller_Liability]
  parent_context: "롯데ON 판매회원의 배송정보 입력, 허위 배송정보, 배송 증빙 및 배송 클레임 처리 의무"
  content: |
    롯데ON 판매회원 이용약관 제15조는 배송정보 입력 및 분쟁 처리 의무를 규정한다.
    판매회원은 상품 등을 물류대행업체에 배송 위탁한 후 즉시 판매자 센터 등에 상품 발송 관련 데이터를 입력하여 발송 완료를 증명하여야 한다.
    실제 배송위탁이 이루어지지 않은 상품 등에 대해 배송정보를 먼저 입력하거나 허위 데이터를 입력하는 경우 회사는 허위배송정보 입력으로 간주한다.
    회사는 판매대금 지급 목적 등으로 판매회원에게 배송 완료를 입증하는 자료 제공을 요청할 수 있으며, 판매회원은 회사가 요구한 기한 내에 자료를 제출하여야 한다.
    판매회원이 배송 증빙자료를 제출하지 않거나 허위 배송정보를 입력한 것으로 확인되는 경우, 이로 인한 일체의 책임은 판매회원에게 있다.
    회사는 구매회원 보호를 위해 구매회원에 대한 환불 등 필요한 조치를 판매회원에 우선하여 취할 수 있다.
    판매회원이 직접 배송하는 경우 배송을 증명할 수 없거나 배송 추적이 되지 않아 발생하는 클레임은 판매회원이 전적으로 책임지며, 판매회원 책임하에 배송사실에 대한 증빙을 제시하고 클레임을 해결하여야 한다.
    도서 WMS에서는 송장 입력, 허위 송장, 배송 증빙 누락, 미수령 클레임, 배송 추적 불가 문제를 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art16_cancel_handling
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제16조 (취소, 반품, 교환 처리) 제1항~제2항"
  category: [Cancellation, Refund, Dispatch, Seller_Obligation]
  parent_context: "롯데ON 판매회원의 구매자 취소 요청 처리, 공급 곤란 통보 및 환불 조치 의무"
  content: |
    롯데ON 판매회원 이용약관 제16조 제1항과 제2항은 취소 처리 의무를 규정한다.
    구매회원의 취소 요청에 대하여 판매회원이 3영업일 이내에 환불처리나 발송확인 처리를 하지 않을 경우, 회사는 구매회원에 대한 환불에 필요한 조치를 취할 수 있다.
    단, 발송처리 완료 이후에는 취소처리가 아니라 반품처리로 진행하여야 한다.
    판매회원은 구매회원이 주문한 상품을 공급하기 곤란하다는 것을 알았을 때 즉시 해당 사실을 구매회원 및 회사에 통보하고 취소하여야 한다.
    회사가 구매회원의 대금 결제일로부터 3영업일 이내에 상품대금 환불 또는 환불에 필요한 조치를 취할 수 있도록 판매회원은 필요한 조치를 하여야 한다.
    도서 WMS에서는 출고 전 취소, 출고 후 반품 전환, 재고 부족 또는 공급 불가로 인한 주문 취소 및 환불 처리 여부를 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art16_return_exchange_restriction
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제16조 (취소, 반품, 교환 처리) 제3항~제5항"
  category: [Return, Exchange, Refund, Exception, Seller_Obligation]
  parent_context: "롯데ON 판매회원의 반품·교환 처리 의무, 반품·교환 거부 가능 사유 및 표시 의무"
  content: |
    롯데ON 판매회원 이용약관 제16조 제3항부터 제5항은 반품 및 교환 처리 의무와 제한 사유를 규정한다.
    판매회원은 배송완료일 후 7일 이내에 구매회원의 반품 또는 교환 신청이 있는 경우 전자상거래법 등 관련 법률에 따라 반품 또는 교환을 진행하여야 한다.
    단, 구매회원에게 책임 있는 사유로 상품 등이 멸실 또는 훼손된 경우, 구매회원의 사용 또는 일부 소비로 상품 가치가 현저히 감소한 경우, 시간이 지나 다시 판매하기 곤란할 정도로 상품 가치가 감소한 경우, 복제가 가능한 상품 등의 포장이 훼손된 경우에는 반품이나 교환을 거부할 수 있다.
    서비스나 디지털콘텐츠의 제공이 개시된 경우, 주문에 따라 개별적으로 생산되는 상품 등에 대해 반품 또는 교환을 인정하면 판매회원에게 회복할 수 없는 중대한 피해가 예상되는 경우, 기타 법령상 반품이 제한되는 경우에도 거부할 수 있다.
    해당 사유가 존재한다는 점은 판매회원이 책임 하에 회사 및 구매회원에게 입증하여야 한다.
    판매회원은 반품이나 교환이 불가능한 상품의 경우 그 사실을 상품 페이지, 상품 포장 또는 구매회원이 쉽게 알 수 있는 곳에 명확하게 표시하거나 시험 사용 상품을 제공하는 등의 방법으로 구매회원의 반품·교환 처리가 방해받지 않도록 하여야 한다.
    부당한 근거로 반품을 거부하는 경우에는 전자상거래 등에서의 소비자보호에 관한 법률에 따른 반품 규정이 판매회원이 지정한 반품 조건보다 우선한다.
    도서 WMS에서는 도서 포장 훼손, 내지 낙서, 물젖음, 찢김, 구성품 누락, 재판매 곤란 여부가 반품·교환 제한 사유에 해당하는지 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art16_misdescription_wrong_delivery
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제16조 (취소, 반품, 교환 처리) 제6항"
  category: [Return, Exchange, Refund, Wrong_Item, Misdescription, Seller_Liability]
  parent_context: "롯데ON 판매회원의 표시·광고 상이, 계약내용 불일치, 미수령 발생 시 반품·교환·환불 조치 의무"
  content: |
    롯데ON 판매회원 이용약관 제16조 제6항은 표시·광고 내용과 다르거나 계약내용과 다르게 이행된 경우의 판매회원 의무를 규정한다.
    판매회원이 판매한 상품 등의 내용이 표시·광고 내용과 다르거나 계약내용과 다르게 이행된 경우, 구매회원은 상품 등을 공급받은 날부터 3개월 이내, 그 사실을 안 날 또는 알 수 있었던 날부터 30일 이내에 반품 또는 교환을 요청할 수 있다.
    판매회원이 물품배송을 위탁한 자의 책임으로 이용자가 상품을 수령하지 못한 경우도 이에 포함된다.
    판매회원은 구매회원의 요청에 따라 반품, 환불 또는 교환에 필요한 조치를 하여야 한다.
    이는 구매회원의 구매확정 여부나 판매자 센터를 통한 반품·교환 처리 가능 여부와 관계없이 판매회원이 관련 법령에 따라 구매회원에게 적절하게 조치하여야 한다.
    도서 WMS에서는 다른 ISBN 발송, 상품 설명과 다른 도서 상태, 구성품 누락, 배송 위탁 문제로 인한 미수령 여부를 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art16_return_inspection_hold_reject
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제16조 (취소, 반품, 교환 처리) 제7항~제8항"
  category: [Return, Inspection, Refund_Hold, Rejection, Seller_Obligation]
  parent_context: "롯데ON 판매회원의 반품 수령 후 3영업일 내 검수, 반품확정·반품보류·반품거부 처리 기준"
  content: |
    롯데ON 판매회원 이용약관 제16조 제7항과 제8항은 반품 상품 수령 후 판매회원의 검수 및 처리 의무를 규정한다.
    상품을 반품 받은 판매회원은 상품을 반환받은 날로부터 3영업일 이내에 검수한 후 반품확정, 반품보류, 반품거부 중 하나의 처리를 이행하여야 한다.
    판매회원이 아무런 처리를 이행하지 않는 경우 자동으로 반품확정 처리되며 구매회원에게 상품 등의 대금이 환불처리된다.
    배송비 정산, 사은품 반환 확인 등이 필요한 경우 판매회원은 반품보류 처리할 수 있으나, 반품보류는 최대 21일까지 가능하며 반품보류 처리기간 동안 상품 등의 대금은 환불되지 않는다.
    관련법령에 따른 정당한 사유가 있는 경우 판매회원은 반품거부 처리 및 구매회원에게 반송할 수 있다. 이 경우 상품 등의 대금은 환불되지 않으며 반품거부 사유에 대한 입증 책임은 판매회원에게 있다.
    반품보류 처리 후 최대 21일을 경과하면 반품보류는 자동으로 해지되고 자동으로 반품확정 처리가 진행된다.
    판매회원이 반품보류 기간 내에 반품과 관련한 필요한 조치를 이행하지 않아 발생한 손실은 판매회원에게 책임이 있다.
    도서 WMS에서는 반품 도서 입고 후 AI 검수, 검수 보류, 환불 보류, 반품 거절, 자동 환불 전환 조건을 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art16_fast_refund_exchange
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제16조 (취소, 반품, 교환 처리) 제9항~제10항"
  category: [Return, Exchange, Fast_Refund, Fast_Exchange, Compensation]
  parent_context: "롯데ON 빠른 환불 서비스 및 빠른 교환 서비스 기준"
  content: |
    롯데ON 판매회원 이용약관 제16조 제9항과 제10항은 빠른 환불 서비스와 빠른 교환 서비스를 규정한다.
    회사는 거래의 종류와 규모, 이용자의 신용도 등을 고려하여 구매회원이 반품을 위해 상품을 발송한 사실이 확인되면 판매회원이 해당 상품에 대한 수령 확인을 하기 전이라도 구매회원에게 신속하게 환불하는 빠른 환불 서비스를 제공할 수 있다.
    판매회원이 전자상거래법상 구매회원의 환불 요구를 거부할 수 있었던 경우 또는 구매회원이 정당한 사유 없이 빠른 환불 서비스를 이용하여 환불받은 경우, 판매회원은 객관적인 자료를 기반으로 회사에 환불 금액에 대한 보상을 요청할 수 있다.
    회사는 구매회원이 교환을 위해 상품을 반송한 사실이 확인되면 판매회원이 교환수령확인을 하기 전이라도 구매회원 주문을 신속하게 교환 출고지시하는 빠른 교환 서비스를 제공할 수 있다.
    구매회원이 부당한 사유로 빠른 교환 서비스를 제공받은 경우, 판매회원은 객관적인 자료를 기반으로 회사에 교환상품 및 교환 비용에 대한 보상을 요청할 수 있다.
    도서 WMS에서는 반품 도서가 회수 중인 상태에서 선환불 또는 선교환 처리가 가능한지, 사후 검수 결과에 따라 판매회원 보상 요청이 필요한지 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art16_return_fee_pickup
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제16조 (취소, 반품, 교환 처리) 제11항~제19항"
  category: [Return, Exchange, Shipping_Fee, Pickup, Seller_Liability]
  parent_context: "롯데ON 반품·교환 비용 부담, 반송지 정보, 회수 지연, 자동반품회수 기준"
  content: |
    롯데ON 판매회원 이용약관 제16조 제11항부터 제19항은 반품·교환 비용 부담과 회수 처리 의무를 규정한다.
    판매회원이 특별한 사유 없이 반품보류 처리하여 이용자의 환불 지연이 발생하는 경우, 판매회원은 관련 법령에 따른 법정 이자 등을 가산하여 보상하는 등 구매회원의 피해를 보상하여야 한다.
    반품·교환 과정에서 발생하는 재화 등의 반환 비용은 반품·교환의 책임이 있는 측이 부담하는 것을 원칙으로 한다.
    구매회원 귀책 반품 또는 교환의 경우에는 구매회원이 비용을 부담하고, 표시·광고 내용과 다르거나 계약내용과 다르게 이행된 경우에는 판매회원이 부담하는 것이 원칙이다.
    판매회원은 구매회원에게 청약철회 등을 이유로 별도의 위약금이나 손해배상을 청구할 수 없다.
    판매회원은 상품의 하자 또는 사용상 안전성에 결함이 있는 경우 전량 리콜, 수리, 교환, 환불하여야 하며, 리콜에 따른 모든 비용을 부담하여야 한다.
    판매회원은 고객의 반품 요청이 접수되었는지 수시로 확인하고 필요한 조치를 취하여야 하며, 이를 확인하지 못했다는 이유로 구매회원의 반품 요청을 거절할 수 없다.
    판매회원은 정확한 반송지 정보와 연락처를 등록하고 유지할 의무가 있으며, 반송지 정보가 부정확하거나 연락두절 등 판매회원의 책임 있는 사유로 상품회수가 원활하지 않은 경우 회사는 구매회원에게 반품 및 환불처리를 진행하거나 판매회원에게 상품 회수를 통지한 후 기간 도과 시 상품을 폐기할 수 있다.
    반품이 접수된 날로부터 3영업일 이내 상품 반환을 위한 조치가 진행되지 않을 경우 회사는 전담 택배 등을 이용하여 상품 반환을 실행할 수 있으며, 발생 비용은 판매회원이 부담한다.
    판매회원은 구매회원이 부담하게 될 반환 비용 등을 상품 페이지에 정확하고 명확하게 기재하여야 하며, 허위 기재로 발생하는 책임은 판매회원에게 있다.
    회사는 반품 절차 지연과 분쟁을 방지하기 위해 자동반품회수 기능을 기본값으로 설정할 수 있다.
    도서 WMS에서는 반품 배송비 부담 주체, 반송지 오류, 회수 지연, 자동 회수, 판매자 귀책 반품 비용 산정에 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art17_compensation
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제17조 (보상)"
  category: [Compensation, Seller_Liability, Claim]
  parent_context: "롯데ON 판매회원 귀책으로 인한 구매회원 손해 보상 처리 기준"
  content: |
    롯데ON 판매회원 이용약관 제17조는 보상 처리 기준을 규정한다.
    회사는 구매회원과 판매회원 간 보상 관련 사항을 처리할 수 있는 보상처리 시스템을 제공한다.
    구매회원은 판매회원의 불성실하거나 부정확한 답변, 품질 불만 등 판매회원 귀책으로 손해가 발생한 경우 보상처리 시스템을 통해 판매회원에게 금전적 보상을 요청할 수 있다.
    판매회원은 그 내용을 확인하여 요청을 승인하거나 거절할 수 있다.
    판매회원이 3영업일 이내 승인 또는 거절을 이행하지 않는 경우 승인으로 간주되어 자동으로 구매회원에게 보상이 지급될 수 있다.
    도서 WMS에서는 판매자 귀책 훼손, 오배송, 상태 설명 불일치, CS 미응대 등으로 구매회원 보상이 필요한지 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art18_settlement
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제18조 (판매대금의 정산)"
  category: [Settlement, Purchase_Confirmation, Payment]
  parent_context: "롯데ON 구매확정 또는 자동구매확정 이후 판매대금 정산 기준"
  content: |
    롯데ON 판매회원 이용약관 제18조는 판매대금 정산 기준을 규정한다.
    구매회원이 서비스 화면에서 직접 구매결정 또는 수취완료를 하거나 자동구매확정이 되면, 그로부터 1영업일 이후부터 판매회원은 판매자 센터 화면에서 출금 가능한 판매예치금을 확인할 수 있다.
    단, 자동구매확정은 회사의 정책이나 이용자 클레임 등 개별 사정에 따라 반영 소요 기간이 변경될 수 있다.
    구매회원의 부분취소 또는 부분환불이 발생하거나 서비스이용료 할인이 적용되는 경우, 판매회원이 예상하는 판매대금과 실제 지급 금액은 다소 상이할 수 있다.
    도서 WMS에서는 반품·교환·환불이 판매대금 정산에 미치는 영향과 구매확정 후 정산 가능 여부를 판단할 때 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art19_payment_hold
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제19조 (지급보류 등)"
  category: [Payment_Hold, Settlement, Claim, Seller_Liability]
  parent_context: "롯데ON 구매자 클레임, 상품 미수령, 배송지연, 하자, 오배송, 분실·파손 등으로 인한 판매대금 지급보류 기준"
  content: |
    롯데ON 판매회원 이용약관 제19조는 판매대금 지급보류 기준을 규정한다.
    구매회원에 의한 보류, 상품 미수령 주장, 소비자 분쟁 등으로 구매결정이 보류되는 경우 또는 회사 정책에 따라 구매확정을 보류하는 경우에는 해당 상품 등의 매출이 확정되지 않으며, 판매대금 등의 정산 및 지급이 발생하지 않는다.
    회사는 장기간 배송지연 건을 배송완료 건으로 간주하여 주문 절차를 종결할 수 있다.
    단, 배송완료 처리를 하더라도 회사는 향후 구매회원의 환불에 대비하여 해당 상품과 관련한 판매대금 등의 지급을 일정 기간 추가로 보류하도록 요청할 수 있다.
    회사는 판매회원이 매매부적합 상품의 판매자로 적발되어 구매자 클레임 다수 발생으로 인한 환불 또는 교환 요청이 우려되는 경우 정산을 보류할 수 있다.
    동일 유형의 클레임, 예를 들어 배송지연, 상품하자 및 상이, 오배송, 분실·파손, 환불·교환·재배송 처리 지연, 가품 판매 및 가품 의심 문제가 지속적으로 발생하는 경우 구매자 클레임에 대비하여 정산대금 지급을 일정 기간 보류할 수 있다.
    도서 WMS에서는 반복적인 도서 훼손, 오배송, 배송지연, 반품 처리 지연, 구매자 클레임 다수 발생 시 판매대금 지급보류 또는 FDS 탐지 근거로 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art31_prohibited_delivery_return
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제31조 (금지행위)"
  category: [Prohibited_Action, Delivery, Return, Exchange, Seller_Liability]
  parent_context: "롯데ON 판매회원의 허위배송정보 입력, 배송유형 오등록, 무재고 재판매, 정당한 사유 없는 취소·반품·교환 거부 금지"
  content: |
    롯데ON 판매회원 이용약관 제31조는 판매회원의 금지행위를 규정한다.
    판매회원은 주문 확인 및 출고 시 허위의 배송정보 또는 송장번호 등을 입력하거나, 출고에 필요한 조치를 취하지 않은 상태에서 사전에 배송정보를 입력해서는 안 된다.
    판매회원은 상품의 배송 유형, 예를 들어 일반배송, 주문제작, 설치 등을 실제 상품의 배송 유형과 다르게 등록해서는 안 된다.
    판매회원은 스스로 재고를 보유하지 않은 상태에서 재고를 보유한 다른 판매자에게 재주문하여 구매자의 배송지로 배송하는 무재고 재판매 행위를 해서는 안 된다.
    판매회원은 본인에게 책임 있는 사유로 주문을 취소하는 것임에도 법령 또는 회사 정책 적용을 회피할 목적으로 구매자에게 취소를 요구하거나 종용해서는 안 된다.
    판매회원은 정당한 사유 없이 구매회원의 상품 주문 취소, 반품, 교환 요청을 보류하거나 거부해서는 안 된다.
    판매회원의 책임으로 일정 비율 이상 취소, 교환 및 반품이 발생하는 경우 잦은 주문 취소, 교환 및 반품으로 금지행위에 해당할 수 있다.
    도서 WMS에서는 허위 송장, 무재고 판매, 배송유형 오등록, 정당한 사유 없는 반품 거부, 반복적인 도서 하자 클레임을 탐지할 때 본 조항을 참고한다.

- chunk_id: lotteon_seller_tos_art32_sanctions_consumer_damage
  platform: LotteON
  authority_level: Contract
  doc_title: "롯데ON 판매회원 이용약관"
  clause_ref: "제32조 (제재 등)"
  category: [Sanction, Refund, Seller_Liability, Consumer_Protection]
  parent_context: "롯데ON 판매회원 약관 위반, 소비자 피해 발생 시 판매중지, 강제 취소, 환불, 손해배상 청구 기준"
  content: |
    롯데ON 판매회원 이용약관 제32조는 약관 위반 및 금지행위에 대한 제재 기준을 규정한다.
    회사는 판매회원의 법령 위반, 약관 위반, 금지행위 여부를 모니터링할 수 있으며, 판매회원은 회사의 모니터링 업무에 성실하게 협조하고 소명 사항 및 증빙 자료를 제출하여야 한다.
    판매회원이 관련 법령, 약관 또는 상거래 일반원칙을 위반한 것으로 판단되는 경우 회사는 경고 및 소명요청, 수정요청, 특정 서비스 이용 제한, 상품 품절처리, 판매중지, 상품 삭제, 거래진행건의 강제 취소 및 환불 처리, 특정 서비스 이용 권한 회수, 판매회원 ID 제한, 계약 해지, 형사상 고소·고발, 민사상 손해배상 청구 등의 조치를 취할 수 있다.
    판매회원의 고의 또는 과실 등 책임 있는 사유로 소비자에게 피해가 발생한 경우, 판매회원은 소비자에 대한 손해배상, 환불, 보상금 지급 등 필요한 조치를 직접 이행하여야 한다.
    회사가 소비자 보호를 위해 해당 금액을 선지급하거나 기타 비용을 부담한 경우, 회사는 그에 상당하는 금액의 전부 또는 일부를 판매회원에게 청구할 수 있다.
    도서 WMS에서는 반복적인 도서 하자, 배송지연, 오배송, 반품 처리 지연, 소비자 피해 발생 시 판매자 제재와 비용 청구 근거로 본 조항을 참고한다.

- chunk_id: hmall_tos_art15_goods_supply_delivery
  platform: HyundaiHmall
  authority_level: Contract
  doc_title: "현대Hmall 이용약관"
  clause_ref: "제15조 (재화 등의 공급)"
  category: [Delivery, Dispatch, Supply]
  parent_context: "현대Hmall 주문 상품의 배송수단, 배송비, 배송기간 및 배송 지연 책임 기준"
  content: |
    현대Hmall 이용약관 제15조는 재화 등의 공급 기준을 규정한다.
    회사는 이용자가 구매한 재화 등에 대해 배송수단, 수단별 배송비용 부담자, 수단별 배송기간 등을 명시한다.
    회사가 약정 배송기간을 초과한 경우에는 그로 인한 이용자의 손해를 배상할 수 있다.
    단, 회사의 고의 또는 과실이 없는 경우에는 책임이 제한될 수 있다.
    도서 WMS에서는 판매자 또는 플랫폼의 배송기간 고지, 배송비 부담, 배송지연 책임 판단, 출고 지연 여부 판단에 본 조항을 참고한다.

- chunk_id: hmall_tos_art16_refund_supply_unavailable
  platform: HyundaiHmall
  authority_level: Contract
  doc_title: "현대Hmall 이용약관"
  clause_ref: "제16조 (환급)"
  category: [Refund, Cancellation, Supply_Unavailable]
  parent_context: "현대Hmall 상품 품절, 공급 불가 또는 주문 취소 시 대금 환급 기준"
  content: |
    현대Hmall 이용약관 제16조는 환급 기준을 규정한다.
    회사는 이용자가 구매 신청한 재화 등을 품절 등의 사유로 인도하거나 제공할 수 없을 때에는 지체 없이 그 사유를 이용자에게 통지한다.
    이미 대금을 받은 경우에는 정해진 기한 내 환급하거나 환급에 필요한 조치를 취한다.
    도서 WMS에서는 품절, 절판, 재고 불일치, 출고 불가, 공급 불가로 인한 주문 취소 및 환불 처리 판단에 본 조항을 참고한다.

- chunk_id: hmall_tos_art17_withdrawal_return_exchange
  platform: HyundaiHmall
  authority_level: Contract
  doc_title: "현대Hmall 이용약관"
  clause_ref: "제17조 (청약철회 등)"
  category: [Return, Exchange, Refund, Cancellation, Exception]
  parent_context: "현대Hmall 청약철회, 반품, 교환 가능 기간 및 반품·교환 제한 사유 기준"
  content: |
    현대Hmall 이용약관 제17조는 청약철회 기준을 규정한다.
    이용자는 재화 등을 공급받은 날부터 7일 이내에 청약철회를 할 수 있다.
    다만 이용자의 책임 있는 사유로 재화 등이 멸실 또는 훼손된 경우, 이용자의 사용 또는 일부 소비로 재화 가치가 현저히 감소한 경우, 시간 경과로 재판매가 곤란할 정도로 가치가 감소한 경우, 복제 가능한 재화 등의 포장이 훼손된 경우, 개별 주문생산 상품 등 법령상 예외에 해당하는 경우에는 청약철회가 제한될 수 있다.
    재화 내용이 표시·광고 내용과 다르거나 계약내용과 다르게 이행된 경우에는 공급받은 날부터 3개월 이내 또는 그 사실을 안 날부터 30일 이내 청약철회가 가능하다.
    도서 WMS에서는 단순변심 반품, 오배송, 파본, 훼손 도서, 포장 훼손, 복제 가능 상품, 주문제작 상품의 반품·교환 가능 여부를 판단할 때 본 조항을 참고한다.

- chunk_id: hmall_tos_art18_withdrawal_effect_refund_shipping_fee
  platform: HyundaiHmall
  authority_level: Contract
  doc_title: "현대Hmall 이용약관"
  clause_ref: "제18조 (청약철회 등의 효과)"
  category: [Refund, Return, Exchange, Shipping_Fee, Payment]
  parent_context: "현대Hmall 청약철회 후 대금 환급 기한, 결제취소, 반환 비용 부담 기준"
  content: |
    현대Hmall 이용약관 제18조는 청약철회 등의 효과를 규정한다.
    회사는 이용자로부터 재화 등을 반환받은 경우 정해진 기한 내 이미 지급받은 재화 등의 대금을 환급한다.
    신용카드 또는 전자화폐 등으로 대금을 지급받은 경우에는 지체 없이 결제수단 제공자에게 청구 정지 또는 취소를 요청할 수 있다.
    청약철회의 경우 반환에 필요한 비용은 원칙적으로 이용자가 부담하나, 재화 등의 내용이 표시·광고 내용과 다르거나 계약내용과 다르게 이행된 경우에는 회사 또는 판매자 측이 반환 비용을 부담할 수 있다.
    도서 WMS에서는 반품 입고 후 환불 기한, 카드결제 취소, 단순변심 반품 배송비, 하자·오배송 반품 배송비 부담 주체를 판단할 때 본 조항을 참고한다.
    