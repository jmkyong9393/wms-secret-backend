[project]
name = "wms-secret-backend"
version = "0.1.0"
description = "B2B AI Quality Inspection & WMS Platform"
readme = "guide.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlmodel>=0.0.19",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.3.4",
    "langchain>=0.2.6",
    "langgraph>=0.1.4",
    "langchain-openai>=0.1.10",
    "langgraph-checkpoint>=1.0.0",
    "celery>=5.6.3",
    "redis>=8.0.1",
    "gevent>=26.5.0",
    "pytest>=9.1.1",
    "alembic>=1.18.5",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==3.2.2",
    "pyjwt>=2.13.0",
    "slowapi>=0.1.10",
    "email-validator>=2.3.0",
    "boto3>=1.43.49",
    "rsa>=4.9.1",
    "tenacity>=9.1.4",
    "Pillow>=10.2.0",
    "pottery>=3.0.1",
    "ultralytics>=8.4.115",
    "numpy>=2.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "httpx>=0.27.0",
]
