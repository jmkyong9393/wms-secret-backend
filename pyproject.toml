[project]
name = "wms-secret-backend"
version = "0.1.0"
description = "B2B AI Quality Inspection & WMS Platform"
readme = "guide.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlmodel>=0.0.19",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.3.4",
    "langchain>=0.2.6",
    "langgraph>=0.1.4",
    "langchain-openai>=0.1.10",
    "langgraph-checkpoint>=1.0.0",
    "celery>=5.6.3",
    "redis>=8.0.1",
    "gevent>=26.5.0",
    "pytest>=9.1.1",
    "alembic>=1.18.5",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==3.2.2",
    "pyjwt>=2.13.0",
    "slowapi>=0.1.10",
    "email-validator>=2.3.0",
    "boto3>=1.43.49",
    "rsa>=4.9.1",
    "tenacity>=9.1.4",
    "Pillow>=10.2.0",
    "pottery>=3.0.1",
    # xgboost 3.4부터 Python>=3.12를 요구해 requires-python(>=3.11)과 충돌한다.
    # 3.2로 낮추어도 3.4로 학습한 JSON 모델이 그대로 로드·추론된다(실측).
    # 일반 xgboost는 CPU만 써도 nvidia-nccl-cu12(342MB)를 필수로 끌고 온다.
    # CPU 전용 배포판은 import 이름·API가 같고 추론 결과도 동일하다(실측).
    "xgboost-cpu>=3.2,<3.4",
    # XGBRegressor는 sklearn 인터페이스라 없으면 ImportError로 폴백된다.
    # 선언이 빠져 있어 학습된 프라이싱 모델이 쓰이지 않고 규칙 산식으로 돌았다.
    "scikit-learn>=1.5",
    "ultralytics>=8.4.115",
    # torch/torchvision은 ultralytics의 전이 의존성이지만 여기에 직접 명시한다.
    # uv의 [tool.uv.sources]는 **직접 의존성에만** 적용되므로, 전이 상태로 두면 아래
    # CPU 전용 인덱스 지정이 조용히 무시된다(2026-08-12 실측: 지정 후에도 pypi.org에서
    # CUDA 동봉 휠을 그대로 해석했다).
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=2.4.6",
    "chromadb-client>=1.0.0",
]

# --- torch를 CPU 전용 휠로 고정 (2026-08-12) ---
# ultralytics가 끌어오는 PyPI 기본 torch 휠은 NVIDIA CUDA 런타임을 통째로 동봉한다.
# 실측(운영 컨테이너 내부): venv 5.5GB 중 nvidia 2.7GB + triton 691MB = 3.4GB가 GPU 전용이다.
# 배포 노드는 t3.medium이고 /dev/nvidia* 가 없어(실측) 이 3.4GB는 단 한 줄도 실행되지 않는다.
#
# 그런데 이 죽은 무게가 실제 장애를 일으켰다: 노드 디스크가 20GB인데 이미지가 3.43GB라
# 배포 때 구·신 이미지가 겹치면 pull 도중 ephemeral-storage 축출 임계선을 스치고,
# 워커 파드가 축출되며 AI 검수 큐가 통째로 멈췄다(2026-08-12 실측: 가용 2.98GB vs 임계 3.02GB).
# CPU 휠로 바꾸면 이미지가 3.4GB -> 1GB대로 줄어 이 실패 경로 자체가 닫힌다.
# GPU 노드로 옮길 일이 생기면 이 두 블록만 지우면 원래 동작으로 돌아간다.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "httpx>=0.27.0",
    # CI가 호출하는데 선언이 없어 "Failed to spawn: ruff"로 죽었다.
    # 버전을 lock에 고정해야 로컬과 CI 결과가 같아진다.
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.ruff.lint]
# 위반 0을 유지한다 - 이 아래 ignore는 "안 고친 것"이 아니라 "검토 후 내린 결정"이다.
# 각 그룹의 사유를 지우거나 규칙을 되살릴 때는 92번 트러블슈팅 아카이브에 근거를 남길 것.
ignore = [
    # ── 런타임 어노테이션 보류: FastAPI·Pydantic·SQLModel이 타입 힌트를 런타임에
    #    평가한다. 일괄 현대화(list[str]·X | None)는 필드 추론을 바꿀 수 있어
    #    도메인별 실물 검증 없이 만지지 않는다 (2026-09-01 결정).
    "UP006", "UP045", "UP035", "RUF013",
    # ── FastAPI 관용구: Depends()/Query()를 기본 인자로 쓰는 것이 프레임워크 표준이다.
    "B008",
    # ── fail-open 폴백 설계: 알림·서명·스로틀 등은 실패를 삼키고 계속 가는 것이
    #    의도다 (프리즈 규정·92번 참조). 광범위 except와 pass는 그 구현이다.
    "BLE001", "S110", "TRY401",
    # ── 부작용 import 검증 전 보류: 제거 시 등록형 import가 깨질 수 있다.
    "F401",
    # ── 실코드 확인 완료, 수정은 동작 변화라 후속: B006(프리즈 구역, 불변 사용),
    #    ASYNC230/251(inbound의 짧은 블로킹 - aiofiles/asyncio.sleep 전환은 별도 건).
    "B006", "ASYNC230", "ASYNC251",
    # ── 미세 스타일·성능 잔여(약 25건) - 후속 일괄 정리 대상.
    "PIE810", "C408", "RUF059", "F841", "SIM102", "PERF102",
    "RUF012", "UP031", "ISC004", "RUF022", "RUF007",
]

[tool.ruff.lint.per-file-ignores]
# 파일명 위장 공격(bidi·zero-width)을 "탐지하는" 보안 코드라 그 문자들이
# 정규식 리터럴에 실제로 들어 있다. 여기서만 의도된 것이다 (93번 문서 ⑤).
"app/core/file_security.py" = ["PLE2502", "PLE2515"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/manual은 외부 자원(OpenAI 키·로컬 .pt·기동 중인 API)을 요구하는 수동 실행본이라
# 수집 대상에서 제외한다. 파일명이 test_로 시작해 기본 설정으로는 수집된다.
addopts = "--ignore=tests/manual"
