services:
  db:
    image: postgres:15-alpine
    container_name: wms-secret-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d wms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma-server:
    image: chromadb/chroma:1.5.9
    container_name: wms-secret-chroma
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data
    # [수정 이력] 종전 헬스체크는 `python -c ...`를 호출했는데 chromadb/chroma 이미지에는
    # python 실행파일이 없어(`/bin/sh: 1: python: not found`) 8370회 연속 실패하며 컨테이너가
    # 계속 unhealthy로 표시됐다. 실제 API는 정상 동작 중이었던 가짜 경보. 또한 /api/v1은
    # Chroma 1.x에서 제거되어 v2로 교체해야 한다.
    # 이미지에 curl/wget/nc가 모두 없으므로 bash의 /dev/tcp 리다이렉션으로 HTTP를 직접 친다.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/8000 && printf "GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: wms-secret-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: wms-secret-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      chroma-server:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: 8000
      REDIS_URL: redis://redis:6379/0
    # Hot-reload mapping for local dev (overrides CMD to use reload)
    volumes:
      - ./app:/app/app
    # --timeout-graceful-shutdown: SSE(notifications/stream) 같은 무한 스트림 연결이 열려 있으면
    # reload 시 "Waiting for connections to close"에서 서버가 영구 데드락되므로 5초 후 강제 종료
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--timeout-graceful-shutdown", "5"]

  worker:
    build: .
    container_name: wms-secret-worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      chroma-server:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: 8000
      REDIS_URL: redis://redis:6379/0
    # Hot-reload mapping for local dev
    volumes:
      - ./app:/app/app
    
    # AI 검수 비동기 작업을 처리하는 Celery Worker
    command: ["celery", "-A", "app.worker.tasks", "worker", "-l", "info", "--pool=gevent", "-E"]

  # flower 컨테이너 추가
  flower:
    image: mher/flower
    container_name: wms-secret-flower
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]


volumes:
  postgres_data:
  chroma_data:
