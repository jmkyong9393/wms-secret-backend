apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: wms-celery-worker-scaler
  namespace: default
  labels:
    app: wms-celery-worker
spec:
  scaleTargetRef:
    name: wms-celery-worker  # 타겟이 되는 일반 Deployment 이름
  minReplicaCount: 1         # I/O 응답 지연 방지를 위해 최소 1대 상시 구동
  maxReplicaCount: 5         # 불필요한 과금 방지를 위한 상한선
  pollingInterval: 15        # KEDA가 Redis 큐를 검사하는 주기 (초)
  cooldownPeriod: 60         # 큐가 비워진 후 축소(Scale-in) 대기 시간 (초)
  triggers:
    - type: redis
      metadata:
        # K8s 클러스터 내부 DNS, 실제 환경 구성에 맞게 변경 가능
        address: "redis-master.default.svc.cluster.local:6379" 
        listName: "celery"   # Celery가 사용하는 기본 큐 리스트 키
        listLength: "10"     # 큐에 남은 메시지가 10개를 초과할 때마다 1개 파드 증가
