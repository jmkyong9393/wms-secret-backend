# FastAPI(uvicorn) API 서버 Deployment
# 이름(wms-api)은 fastapi-hpa.yaml의 scaleTargetRef와 일치해야 한다.
# [2026-08-10] 이미지 빌드/푸시·태그 교체 모두 deploy.yml(main 푸시 자동, SSH 배포)이
# 담당한다. ecr-push.yml/deploy-prod.yml은 수동 재빌드·재배포용 보조 경로다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wms-api
  namespace: default
  labels:
    app: wms-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wms-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: wms-api
    spec:
      containers:
      - name: api
        # ECR 레포 이름은 deploy.yml/ecr-push.yml/deploy-prod.yml과 동일 (nexus-backend-repo).
        # <AWS_ACCOUNT_ID>만 실제 계정 ID로 치환 (restock-scan-cronjob.yaml과 동일 규칙)
        image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/nexus-backend-repo:latest
        ports:
        - containerPort: 8000
        # wms-backend-secret 생성 방법은 restock-scan-cronjob.yaml 주석 참조
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: wms-backend-secret
              key: DATABASE_URL
        - name: REDIS_URL
          value: "redis://redis-master.default.svc.cluster.local:6379/0"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: wms-backend-secret
              key: OPENAI_API_KEY
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        # WBF 3-YOLO 모델 로딩으로 기동이 느릴 수 있어 startupProbe로 최대 150초 대기
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 5
