# RAG 벡터 저장소 (ChromaDB) — Policy Agent 근거 조항 인용 / HITL 브리핑용
#
# 이 리소스가 없으면 rag_service가 fail-open으로 조용히 비활성화된다. UBCI 점수·등급은
# 결정론적 산식이라 영향이 없지만, 감점의 근거 조항 인용과 HITL 브리핑의 관련 규정이
# 전부 빈 목록이 된다.
#
# 인덱스는 PVC에 영속되므로 파드가 재시작해도 재빌드가 필요 없다.
# 컬렉션이 비어 있으면 rag-index-job.yaml을 실행한다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-gp3-sc
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chroma-server
  namespace: default
  labels:
    app: chroma-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chroma-server
  # 단일 PVC(RWO)에 인덱스를 쓰므로 두 파드가 동시에 붙으면 안 된다.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: chroma-server
    spec:
      containers:
      - name: chroma
        # 로컬 docker-compose와 동일 태그로 고정 — 인덱스 포맷 불일치를 막는다.
        image: chromadb/chroma:1.5.9
        ports:
        - containerPort: 8000
        env:
        - name: IS_PERSISTENT
          value: "TRUE"
        - name: PERSIST_DIRECTORY
          value: "/chroma/data"
        volumeMounts:
        - name: data
          mountPath: /chroma/data
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        # 이미지에 curl/wget/nc/python이 모두 없어 docker-compose에서는 bash /dev/tcp로
        # 우회했다. k8s의 httpGet은 kubelet이 파드 밖에서 치므로 그 제약을 받지 않는다.
        startupProbe:
          httpGet:
            path: /api/v2/heartbeat
            port: 8000
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /api/v2/heartbeat
            port: 8000
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v2/heartbeat
            port: 8000
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: chroma-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: chroma-server
  namespace: default
  labels:
    app: chroma-server
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: chroma-server
