# Lightsail 단일 박스 프로덕션 구성.
#
# 로컬 docker-compose.yml과의 차이:
#   - build 대신 ECR 이미지를 pull 한다 (태그 = git SHA, 롤백은 .env의 태그 교체)
#   - dev 볼륨 마운트·--reload 제거 (핫리로드 없음)
#   - Caddy가 TLS 종료를 맡는다 (기존 ALB 역할, Let's Encrypt 자동 갱신)
#   - flower 제외 (메모리 절약 - 필요하면 `--profile debug`로 켠다)
#   - 서비스별 mem_limit: 4GB 박스에서 한 컨테이너의 폭주가 전체를 죽이지 않게 상한만 건다
#     (상한 합계가 4GB를 넘는 것은 의도 - 예약이 아니라 폭주 차단용이다)
#
# 외부 노출은 Caddy(80/443)뿐이다. 나머지는 컨테이너 네트워크 안에서만 통신한다.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: wms_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d wms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma-server:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data
    mem_limit: 384m
    # chroma 이미지에는 python·curl·wget이 없다 - bash /dev/tcp로 직접 HTTP를 친다
    # (로컬 compose에서 8,370회 가짜 unhealthy를 낸 전례가 있어 같은 방식을 쓴다)
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/8000 && printf "GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: ${ECR_REGISTRY:?}/nexus-backend-repo:${BACKEND_TAG:-latest}
    restart: unless-stopped
    networks:
      default:
        aliases:
          # 프론트 이미지는 CI가 BACKEND_ORIGIN=http://wms-api-svc:8000 으로 굽고,
          # Next standalone은 rewrites를 "빌드 시점"에 굳힌다 - 런타임 env로 못 바꾼다
          # (리허설 실측: getaddrinfo ENOTFOUND wms-api-svc, 2026-09-01).
          # 그래서 이미지를 바꾸는 대신 k8s Service 이름을 여기서 재현한다.
          # k8s와 Lightsail이 같은 프론트 이미지를 쓰는 것이 이 별칭의 존재 이유다.
          - wms-api-svc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma-server:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:?}@db:5432/wms_db
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: 8000
      REDIS_URL: redis://redis:6379/0
    mem_limit: 1024m
    # SSE 무한 스트림이 열려 있으면 graceful shutdown이 데드락된다 - 5초 후 강제 종료
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "5"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    image: ${ECR_REGISTRY:?}/nexus-backend-repo:${BACKEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma-server:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:?}@db:5432/wms_db
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: 8000
      REDIS_URL: redis://redis:6379/0
    # 실측(2026-09-01): 3-YOLO 전체 로드 603MB, 추론 포함 피크 870MB.
    # 상한 1.5GB는 이미지 4컷 동시 처리 스파이크 여유분이다.
    mem_limit: 1536m
    # concurrency는 .env로 조절한다 - 2GB 플랜은 2, 4GB 플랜은 4 권장 (README 참조)
    command: ["celery", "-A", "app.worker.tasks", "worker", "-l", "info", "--pool=gevent", "--concurrency=${WORKER_CONCURRENCY:-2}", "-E"]

  beat:
    image: ${ECR_REGISTRY:?}/nexus-backend-repo:${BACKEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:?}@db:5432/wms_db
      REDIS_URL: redis://redis:6379/0
    mem_limit: 256m
    # non-root 컨테이너라 /app 루트에 스케줄 파일을 못 쓴다 - /tmp에 둔다 (08-12 실측)
    command: ["celery", "-A", "app.worker.tasks", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]

  frontend:
    image: ${ECR_REGISTRY:?}/nexus-frontend-repo:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # BACKEND_ORIGIN은 여기 두지 않는다 - Next standalone이 rewrites를 빌드 시점에
      # 굳혀 런타임 env가 무시된다(리허설 실측). 대신 api 서비스가 k8s 서비스명
      # wms-api-svc를 네트워크 별칭으로 재현한다 (api 서비스의 aliases 주석 참조).
      PORT: "3000"
    mem_limit: 512m
    healthcheck:
      # standalone 이미지에는 curl이 없다 - Node 18+ 내장 fetch를 쓴다
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

  # 디버깅용 - 평소에는 뜨지 않는다: docker compose --profile debug up -d flower
  flower:
    image: mher/flower
    restart: unless-stopped
    profiles: ["debug"]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5555:5555"
    mem_limit: 128m
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]

volumes:
  postgres_data:
  chroma_data:
  caddy_data:
  caddy_config:
