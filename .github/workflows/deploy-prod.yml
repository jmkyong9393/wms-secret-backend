# 프로덕션 수동 재배포 전용 워크플로우 (지정 태그로 롤백/재배포).
# 이미지 빌드/푸시는 deploy.yml(main 푸시마다 자동) 또는 ecr-push.yml(수동)이 담당하므로,
# 여기서는 이미 ECR에 존재하는 이미지 태그를 골라 클러스터에 반영하는 역할만 한다.
# [2026-08-10] EKS(aws eks update-kubeconfig)는 실제로 쓴 적이 없는 초기 설계 잔재였다 -
# 실제 라이브 클러스터는 EC2 자체 구축 kubeadm이라 deploy.yml과 동일한 SSH 방식으로 교체.
# kubectl apply(k8s/deployment.yml, service.yml)도 함께 제거했다 - 매니페스트의
# <AWS_ACCOUNT_ID> 플레이스홀더가 미치환 상태라 그대로 apply하면 실패하고,
# 최초 1회 적용은 이미 클러스터에 반영되어 있어 태그 교체만 있으면 된다.
# [2026-08-10 추가 정정] KUBE_NAMESPACE도 wms -> default. 실측(kubectl get ns) 결과
# wms 네임스페이스 자체가 클러스터에 존재하지 않고 전체 앱이 default에 떠 있음을 확인했다.
name: Backend Prod Deploy (Manual Redeploy)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 ECR 이미지 태그 (commit SHA 또는 latest)"
        required: true
        default: "latest"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: nexus-backend-repo
  KUBE_NAMESPACE: default

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy via SSH (Manual Redeploy)
        if: ${{ secrets.EC2_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            REG=${{ steps.login-ecr.outputs.registry }}
            TAG=${{ github.event.inputs.image_tag }}
            kubectl set image deployment/wms-api api=$REG/${{ env.ECR_REPOSITORY }}:$TAG -n ${{ env.KUBE_NAMESPACE }}
            kubectl rollout status deployment/wms-api -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
