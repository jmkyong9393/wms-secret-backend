name: Deploy Backend to ECR (Manual Rebuild)

# deploy.yml이 main 푸시마다 nexus-backend-repo를 자동 빌드/푸시/배포하므로,
# 이 워크플로우는 코드 변경 없이 이미지만 다시 빌드/푸시하고 싶을 때(캐시 무효화,
# 베이스 이미지 갱신 등) 쓰는 수동 전용 경로다. 자동 push 트리거는 두지 않는다 -
# 켜두면 deploy.yml과 이중 빌드가 된다.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: nexus-backend-repo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
