# Lightsail 박스에 새 이미지 태그를 반영한다.
#
# 빌드·ECR 푸시는 기존 deploy.yml(main push)이 계속 담당한다 - 이 워크플로는
# "어느 SHA를 박스에 올릴지"만 다룬다. 컷오버 전까지는 수동 트리거(workflow_dispatch)
# 전용으로 두어, main push가 아직 살아 있는 k8s 클러스터 배포를 깨지 않게 한다.
# 컷오버 후: deploy.yml의 k8s 단계를 내리고 이 워크플로에 push 트리거를 옮긴다.
#
# 필요한 GitHub Secrets:
#   LIGHTSAIL_HOST     - 박스 고정 IP 또는 호스트명
#   LIGHTSAIL_SSH_KEY  - 배포용 개인키 (박스 ~/.ssh/authorized_keys에 공개키 등록)

name: Deploy to Lightsail

on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: "배포할 백엔드 이미지 태그 (git SHA, 기본 latest)"
        default: "latest"
      frontend_tag:
        description: "배포할 프론트 이미지 태그 (git SHA, 기본 latest)"
        default: "latest"

concurrency:
  group: lightsail-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script_stop: true
          script: |
            set -eo pipefail                 # 파이프 중간 실패(ECR 로그인 등)도 즉시 중단
            export PATH="$PATH:/snap/bin"    # 비인터랙티브 셸에는 snap 경로가 없다 - aws가 여기 있다 (첫 실전 실패 원인)
            cd ~/wms-secret-backend/deploy/lightsail
            # ECR 인증은 박스 로컬 .env의 앱 키로 한다 - 이 export가 없으면
            # 인스턴스 역할(Lightsail 내부 계정)로 폴백해 AccessDenied가 난다 (2차 실전 실패 원인)
            export AWS_ACCESS_KEY_ID="$(grep '^AWS_ACCESS_KEY_ID=' .env | cut -d= -f2)"
            export AWS_SECRET_ACCESS_KEY="$(grep '^AWS_SECRET_ACCESS_KEY=' .env | cut -d= -f2)"
            # 태그만 갱신 - 나머지 .env 값은 박스에 있는 그대로 둔다
            sed -i "s/^BACKEND_TAG=.*/BACKEND_TAG=${{ inputs.backend_tag }}/" .env
            sed -i "s/^FRONTEND_TAG=.*/FRONTEND_TAG=${{ inputs.frontend_tag }}/" .env
            aws ecr get-login-password --region ap-northeast-2               | docker login --username AWS --password-stdin "$(grep '^ECR_REGISTRY=' .env | cut -d= -f2)"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --wait
            docker image prune -f
            # 배포 후 즉시 검증 - 호스트에는 8000이 열려 있지 않다(Caddy만 노출) →
            # 컨테이너 안에서 친다. 실패하면 워크플로가 빨간불이 된다.
            docker compose -f docker-compose.prod.yml exec -T api python -c "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health', timeout=10).read().decode(); print(r); sys.exit(0 if 'ok' in r else 1)"
