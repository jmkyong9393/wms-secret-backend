name: Backend PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: uv sync --frozen --dev
        
      # 포맷 부채(91파일)는 걷어냈고 아래 Format Check는 하드 게이트로 되돌렸다.
      # ruff check 1,253건은 아직 남아 있어 경고로 둔다 - 자동수정 대상 대부분이
      # 타입 어노테이션 현대화(UP006/UP045 640건)라, FastAPI·Pydantic·SQLModel이
      # 어노테이션을 런타임에 평가하는 구조에서 필드 추론이 바뀔 위험이 있다.
      # 규칙별로 실물 검증을 거친 뒤 단계적으로 켠다.
      - name: Lint (Ruff)
        run: |
          uv run ruff check app/ || echo "Warning - Ruff 위반이 남아 있다. 부채 정리 PR에서 처리한다."

      # 포맷은 부채를 전부 걷어냈으므로 하드 게이트다. 깨지면 `uv run ruff format app/`.
      - name: Format Check (Ruff)
        run: uv run ruff format --check app/
        
      - name: Type Check (Mypy)
        run: |
          uv run mypy app/ || echo "Warning - Mypy failed, check types later"

      - name: Run Tests (Pytest)
        run: |
          uv run pytest || echo "Warning - No tests written yet or tests failed"
