name: Backend PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: uv sync --frozen --dev
        
      # 안전 규칙 127건은 수정했고(프리즈 구역 21건은 예외 승인),
      # 나머지는 pyproject [tool.ruff.lint]에 사유와 함께 ignore로 문서화했다.
      # 이제 위반 0이 기준이며 이 단계는 하드 게이트다 (2026-09-01 복원).
      - name: Lint (Ruff)
        run: uv run ruff check app/

      # 포맷은 부채를 전부 걷어냈으므로 하드 게이트다. 깨지면 `uv run ruff format app/`.
      - name: Format Check (Ruff)
        run: uv run ruff format --check app/
        
      - name: Type Check (Mypy)
        run: |
          uv run mypy app/ || echo "Warning - Mypy failed, check types later"

      - name: Run Tests (Pytest)
        run: |
          uv run pytest || echo "Warning - No tests written yet or tests failed"
