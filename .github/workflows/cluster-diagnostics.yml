# 클러스터 리소스 실측 — 읽기 전용 진단 전용 워크플로.
# 배포·변경을 일절 하지 않는다. kubectl get/top/describe만 수행한다.
# 용도: requests/limits를 실사용에 맞춰 조정하기 전, 추정이 아닌 실측을 확보한다.
name: Cluster Diagnostics (Read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - name: Collect cluster resource facts (read-only)
        if: ${{ env.EC2_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=============== 1. 노드 용량 ==============="
            kubectl get nodes -o custom-columns=\
            'NODE:.metadata.name,ALLOC_MEM:.status.allocatable.memory,CAP_MEM:.status.capacity.memory,ALLOC_CPU:.status.allocatable.cpu'

            echo ""
            echo "=============== 2. 노드별 요청 합계 vs 가용 ==============="
            for N in $(kubectl get nodes -o jsonpath='{.items[*].metadata.name}'); do
              echo "--- $N"
              kubectl describe node "$N" | sed -n '/Allocated resources/,/Events/p' | head -12
            done

            echo ""
            echo "=============== 3. 파드 실사용 (top) ==============="
            kubectl top pods --no-headers 2>/dev/null \
              || echo "[metrics-server 없음] 4번 cgroup 실측으로 대체"

            echo ""
            echo "=============== 4. 컨테이너 실사용 — cgroup 직접 판독 ==============="
            # metrics-server가 없어도 동작한다. working_set = usage - inactive_file
            for D in wms-api wms-ai-worker wms-beat wms-frontend postgres redis chroma-server; do
              for P in $(kubectl get pods -l app=$D -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' 2>/dev/null); do
                CUR=$(kubectl exec "$P" -- sh -c 'cat /sys/fs/cgroup/memory.current 2>/dev/null || cat /sys/fs/cgroup/memory/memory.usage_in_bytes 2>/dev/null' 2>/dev/null)
                INA=$(kubectl exec "$P" -- sh -c 'grep -w inactive_file /sys/fs/cgroup/memory.stat 2>/dev/null | head -1 | awk "{print \$2}"' 2>/dev/null)
                if [ -n "$CUR" ]; then
                  WS=$(( (CUR - ${INA:-0}) / 1048576 ))
                  echo "$D / $P : working_set ${WS}Mi"
                else
                  echo "$D / $P : 판독 실패"
                fi
              done
            done

            echo ""
            echo "=============== 5. 현재 선언된 requests/limits ==============="
            kubectl get deploy -o custom-columns=\
            'DEPLOY:.metadata.name,REPLICAS:.spec.replicas,REQ_MEM:.spec.template.spec.containers[0].resources.requests.memory,LIM_MEM:.spec.template.spec.containers[0].resources.limits.memory,SURGE:.spec.strategy.rollingUpdate.maxSurge,UNAVAIL:.spec.strategy.rollingUpdate.maxUnavailable'

            echo ""
            echo "=============== 6. 최근 축출/스케줄 실패 이벤트 ==============="
            kubectl get events --field-selector type=Warning \
              --sort-by=.lastTimestamp -o wide 2>/dev/null | tail -15

            echo ""
            echo "=============== 7. 노드별 파드 요청 내역 (누가 예약을 붙잡고 있나) ==============="
            # Requests는 '예약'이라 캐시 정리로 줄지 않는다. 실제 점유 주체를 본다.
            kubectl get pods -A --field-selector status.phase=Running \
              -o custom-columns='NODE:.spec.nodeName,NS:.metadata.namespace,POD:.metadata.name,MEM_REQ:.spec.containers[*].resources.requests.memory' \
              --no-headers 2>/dev/null | sort | awk '{printf "%-20s %-14s %-42s %s\n", $1,$2,$3,$4}'

            echo ""
            echo "=============== 8. 정리 가능 대상 (Running 아님 = 예약 미점유) ==============="
            echo "--- 비-Running 파드"
            kubectl get pods -A --no-headers 2>/dev/null \
              | awk '$4!="Running" {print "  ", $1, $2, $4}' | head -20
            echo "--- 완료된 Job"
            kubectl get jobs -A --no-headers 2>/dev/null | head -10
            echo "--- 유휴 ReplicaSet (desired=0)"
            kubectl get rs -A --no-headers 2>/dev/null | awk '$3=="0" && $4=="0" {c++} END {print "   개수:", c+0}'

            echo ""
            echo "=============== 8-2. CPU 예약 내역 · 실사용 ==============="
            echo "--- 노드별 파드 CPU 예약"
            kubectl get pods -A --field-selector status.phase=Running \
              -o custom-columns='NODE:.spec.nodeName,POD:.metadata.name,CPU_REQ:.spec.containers[*].resources.requests.cpu' \
              --no-headers 2>/dev/null | sort | awk '$3!="<none>"{printf "  %-18s %-44s %s\n",$1,$2,$3}'
            echo "--- 디플로이 선언값"
            kubectl get deploy -o custom-columns=\
            'DEPLOY:.metadata.name,CPU_REQ:.spec.template.spec.containers[0].resources.requests.cpu,CPU_LIM:.spec.template.spec.containers[0].resources.limits.cpu'
            echo "--- 실사용 (cpu.stat 10초 델타 → 밀리코어)"
            for D in wms-api wms-frontend wms-ai-worker wms-beat postgres redis chroma-server; do
              for P in $(kubectl get pods -l app=$D -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' 2>/dev/null); do
                A=$(kubectl exec "$P" -- sh -c 'grep -w usage_usec /sys/fs/cgroup/cpu.stat 2>/dev/null | awk "{print \$2}"' 2>/dev/null)
                sleep 10
                B=$(kubectl exec "$P" -- sh -c 'grep -w usage_usec /sys/fs/cgroup/cpu.stat 2>/dev/null | awk "{print \$2}"' 2>/dev/null)
                if [ -n "$A" ] && [ -n "$B" ]; then
                  echo "  $D / $P : $(( (B - A) / 10000 ))m"
                else
                  echo "  $D / $P : 판독 실패"
                fi
              done
            done

            echo ""
            echo "=============== 9. 노드 실제 메모리 (예약이 아닌 호스트 실사용) ==============="
            free -m | sed -n '1,2p'
            echo "--- 컨테이너 이미지 점유"
            sudo crictl images 2>/dev/null | tail -8 || echo "(crictl 조회 불가)"
