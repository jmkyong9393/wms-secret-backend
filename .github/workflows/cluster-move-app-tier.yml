# 3a 실행 — 앱 티어(FE/API/DB/Redis)를 마스터로, 워커 노드는 AI 전용으로.
# 40번 §2-2 설계("마스터=FE/API/DB/Redis, 워커노드=AI 전용")와 실제 배치가 반대로
# 되어 있던 것을 바로잡는다. 문서를 바꾸는 게 아니라 문서가 사실이 되게 만든다.
#
# 단계를 쪼갠 이유: postgres만 되돌리기 어렵다. 무상태 → 준무상태 → 상태유지 순으로
# 진행하고, 각 단계마다 멈춰서 검증할 수 있게 한다.
name: Move App Tier to Master (Phased)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "backup | label | stateless | redis | postgres | verify | rollback"
        required: true
        default: "backup"

permissions:
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - name: Execute phase
        if: ${{ env.EC2_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            PHASE="${{ github.event.inputs.phase }}"
            MASTER=$(kubectl get nodes -l node-role.kubernetes.io/control-plane -o jsonpath='{.items[0].metadata.name}')
            [ -n "$MASTER" ] || MASTER=$(kubectl get nodes -o jsonpath='{.items[?(@.metadata.labels.workload-type!="ai-worker")].metadata.name}' | awk '{print $1}')
            WORKER=$(kubectl get nodes -l workload-type=ai-worker -o jsonpath='{.items[0].metadata.name}')
            echo "마스터=$MASTER / AI워커노드=$WORKER / 단계=$PHASE"
            echo ""

            case "$PHASE" in

            backup)
              echo "=============== DB 백업 (되돌릴 수 없는 단계 전 필수) ==============="
              PG=$(kubectl get pods -l app=postgres -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' | awk '{print $1}')
              TS=$(date +%Y%m%d_%H%M%S)
              mkdir -p ~/db_backups
              kubectl exec "$PG" -- pg_dumpall -U postgres > ~/db_backups/all_${TS}.sql
              ls -lh ~/db_backups/all_${TS}.sql
              echo "행 수 확인:"
              grep -c "" ~/db_backups/all_${TS}.sql
              echo "✅ 백업 완료 — 이 파일이 있어야 다음 단계로 간다"
              ;;

            label)
              echo "=============== 노드 라벨 부여 (마스터=app) ==============="
              kubectl label node "$MASTER" workload-type=app --overwrite
              kubectl get nodes -L workload-type
              echo "✅ 라벨 완료 — 아직 파드는 움직이지 않는다"
              ;;

            stateless)
              echo "=============== 무상태 이동: wms-api · wms-frontend (무중단 롤링) ==============="
              for D in wms-api wms-frontend; do
                kubectl patch deployment "$D" -p \
                  '{"spec":{"template":{"spec":{"nodeSelector":{"workload-type":"app"}}}}}'
                kubectl rollout status deployment/"$D" --timeout=300s
              done
              kubectl get pods -o wide --no-headers | awk '{print "  ",$1,$3,$7}'
              ;;

            redis)
              echo "=============== redis 이동 (PVC 없음 · 짧은 재시작) ==============="
              echo "⚠ Celery 브로커다. 진행 중 검수가 있으면 큐가 비워질 수 있다."
              kubectl get pods -l app=wms-ai-worker --no-headers | awk '{print "  현재 워커:",$1,$3}'
              kubectl patch deployment redis -p \
                '{"spec":{"template":{"spec":{"nodeSelector":{"workload-type":"app"}}}}}'
              kubectl rollout status deployment/redis --timeout=300s
              kubectl get pods -o wide --no-headers | awk '{print "  ",$1,$3,$7}'
              ;;

            postgres)
              echo "=============== postgres 이동 (짧은 다운타임 · EBS 재부착) ==============="
              echo "이동 전 데이터 확인:"
              PG=$(kubectl get pods -l app=postgres -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' | awk '{print $1}')
              kubectl exec "$PG" -- psql -U postgres -t -c \
                "select 'tables=' || count(*) from information_schema.tables where table_schema='public';" || true

              kubectl patch deployment postgres -p \
                '{"spec":{"strategy":{"type":"Recreate"},"template":{"spec":{"nodeSelector":{"workload-type":"app"}}}}}'
              echo "Recreate 전략으로 전환 — 구 파드를 완전히 내린 뒤 EBS를 새 노드에 붙인다"
              kubectl rollout status deployment/postgres --timeout=600s

              echo ""
              echo "이동 후 데이터 확인:"
              PG2=$(kubectl get pods -l app=postgres -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' | awk '{print $1}')
              kubectl exec "$PG2" -- psql -U postgres -t -c \
                "select 'tables=' || count(*) from information_schema.tables where table_schema='public';"
              kubectl get pods -o wide --no-headers | awk '{print "  ",$1,$3,$7}'
              ;;

            verify)
              echo "=============== 최종 검증 ==============="
              echo "--- 노드별 배치 (기대: 워커노드에 wms-ai-worker만)"
              kubectl get pods -o wide --no-headers | awk '{printf "  %-38s %-10s %s\n",$1,$3,$7}' | sort -k3
              echo ""
              echo "--- 노드 예약률"
              for N in $(kubectl get nodes -o jsonpath='{.items[*].metadata.name}'); do
                echo -n "  $N : "
                kubectl describe node "$N" | grep -A4 'Allocated resources' | grep -w memory || true
              done
              echo ""
              echo "--- 서비스 응답"
              kubectl run curltest --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- \
                -s -o /dev/null -w "  api /health = %{http_code}\n" \
                http://wms-api-service:8000/health 2>/dev/null || echo "  (curl 파드 실행 실패 — 외부에서 확인)"
              echo ""
              echo "--- 최근 경고"
              kubectl get events --field-selector type=Warning --sort-by=.lastTimestamp 2>/dev/null | tail -5
              ;;

            rollback)
              echo "=============== 롤백: nodeSelector 제거 (원위치 복귀) ==============="
              for D in wms-api wms-frontend redis postgres; do
                kubectl patch deployment "$D" --type=json \
                  -p='[{"op":"remove","path":"/spec/template/spec/nodeSelector"}]' 2>/dev/null \
                  && echo "  $D nodeSelector 제거" || echo "  $D (nodeSelector 없음)"
              done
              kubectl patch deployment postgres -p '{"spec":{"strategy":{"type":"RollingUpdate"}}}' 2>/dev/null || true
              echo "⚠ 스케줄러가 재배치한다. postgres 데이터는 PVC에 있으므로 보존된다."
              ;;

            *)
              echo "알 수 없는 단계: $PHASE"; exit 1 ;;
            esac
