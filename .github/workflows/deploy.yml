name: Nexus Backend CI/CD (v3.1)
on:
  # 앱 산출물과 무관한 변경(문서·운영 워크플로)은 빌드하지 않는다.
  # 실측 2026-08-19: 워크플로 파일 수정 푸시가 풀 빌드를 19회 유발해 165분을 소비했다.
  # 운영 워크플로는 workflow_dispatch로 따로 실행하므로 배포가 필요 없다.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/cluster-*.yml'
      - 'deploy/**'
  workflow_dispatch:        # 문서만 바꾼 뒤에도 수동 배포는 언제든 가능
permissions: { id-token: write, contents: read }

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 잡 레벨 env — 모든 스텝의 if:/with: 어디서든 동일하게 보장되어 참조되는 위치에
    # 따라 평가 시점이 갈리는 스텝 레벨 env 논쟁 자체를 없앤다.
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
    - name: Free runner disk space (Model Baking 이미지가 큼 — 기본 여유공간 부족으로 빌드 중 디스크 고갈)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        docker-images: false
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ap-northeast-2
    - id: ecr
      uses: aws-actions/amazon-ecr-login@v2
    - uses: docker/setup-buildx-action@v3

    - name: Build & Push Backend (api+worker 공용, Model Baked)
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ steps.ecr.outputs.registry }}/nexus-backend-repo:${{ github.sha }}
          ${{ steps.ecr.outputs.registry }}/nexus-backend-repo:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy via SSH (Rolling Update)
      if: ${{ env.EC2_HOST != '' }}
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ env.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          REG=${{ steps.ecr.outputs.registry }}
          SHA=${{ github.sha }}
          SHORT=$(echo $SHA | cut -c1-12)

          # --- DB 마이그레이션 (롤아웃 '전에' 실행) ---
          #
          # 종전에는 이 워크플로가 스키마를 건드리지 않아, 컬럼을 추가하는 배포는 사람이
          # EC2에 들어가 alembic을 수동 실행해야 했다(잊으면 신코드가 없는 컬럼을 조회해 500).
          #
          # 순서가 중요하다. 롤아웃 뒤에 돌리면 "새 코드는 떴는데 컬럼은 아직 없는" 구간이
          # 생긴다. 반대로 마이그레이션을 먼저 하면 구 코드는 새 컬럼을 모를 뿐이라(추가·
          # nullable) 무해하다. 마이그레이션 파일은 새 이미지에만 있으므로 실행 중인 파드가
          # 아니라 **새 이미지로 만든 일회성 Job**으로 돌린다. DATABASE_URL은 배포와 동일한
          # 시크릿에서 주입해 접속 정보가 두 곳으로 갈라지지 않게 한다.
          kubectl delete job wms-migrate-$SHORT --ignore-not-found
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: wms-migrate-$SHORT
          spec:
            backoffLimit: 1
            ttlSecondsAfterFinished: 600
            # 이미지 pull이 길어도 스스로 죽지 않게 넉넉히 두되, 무한 대기는 막는다.
            activeDeadlineSeconds: 1200
            template:
              spec:
                restartPolicy: Never
                # kubeadm+containerd는 노드 IAM 역할만으로 ECR을 당기지 못한다. Deployment는
                # 이 시크릿을 patch로 받아두었으므로(블루프린트 §2-6) Job에도 동일하게 지정한다.
                # 빠뜨리면 ImagePullBackOff로 마이그레이션이 시작조차 못 한다.
                imagePullSecrets:
                - name: ecr-secret
                containers:
                - name: migrate
                  image: $REG/nexus-backend-repo:$SHA
                  command: ["alembic", "upgrade", "head"]
                  env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: wms-backend-secret
                        key: DATABASE_URL
          EOF

          # 마이그레이션 완료를 기다린다. 실패하면 배포를 멈춘다 - 깨진 스키마 위에
          # 새 코드를 올리는 것보다 구 버전이 계속 도는 편이 안전하다.
          #
          # [2026-08-10 사고 2] 종전에는 `kubectl wait --for=condition=complete --timeout=300s`를
          # 썼는데 5분 안에 끝나지 못해 배포가 중단됐다. 이 Job은 **모델이 구워진 거대 이미지를
          # 처음 pull** 해야 하고(빌드·푸시에만 10분 걸리는 이미지), 롤아웃 전에 도는 첫 파드라
          # 노드 캐시가 비어 있다. 300초는 이 환경에서 애초에 부족한 값이었다.
          #
          # 또한 `kubectl wait`는 complete 조건만 볼 수 있어 **Job이 이미 실패해도 타임아웃까지
          # 그대로 기다린다.** 완료·실패를 함께 감시해 진짜 실패는 즉시 드러나게 한다.
          MIGRATED=0
          for _ in $(seq 1 120); do   # 120 x 10s = 최대 20분 (activeDeadlineSeconds와 동일)
            if [ "$(kubectl get job wms-migrate-$SHORT -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null)" = "True" ]; then
              MIGRATED=1; break
            fi
            if [ "$(kubectl get job wms-migrate-$SHORT -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null)" = "True" ]; then
              echo "::error::DB 마이그레이션 실패 - 배포를 중단합니다"
              # [2026-08-10 사고 3] `kubectl logs job/...`은 파드를 하나만 골라 읽는데
              # 그 파드가 종료 상태면 BadRequest로 아무것도 못 본다. 실제 alembic 오류가
              # 가려져 원인 파악이 두 번이나 막혔다. 파드를 전부 순회해 로그를 긁는다.
              for p in $(kubectl get pods -l job-name=wms-migrate-$SHORT -o name 2>/dev/null); do
                echo "===== $p ====="
                kubectl logs $p --tail=60 2>&1 || kubectl logs $p --previous --tail=60 2>&1 || true
              done
              kubectl describe job/wms-migrate-$SHORT 2>&1 | tail -30 || true
              exit 1
            fi
            sleep 10
          done

          if [ "$MIGRATED" != "1" ]; then
            echo "::error::DB 마이그레이션 시간 초과 - 배포를 중단합니다"
            kubectl describe job/wms-migrate-$SHORT 2>&1 | tail -30 || true
            kubectl get pods -l job-name=wms-migrate-$SHORT 2>&1 || true
            exit 1
          fi

          # 성공 로그는 어디까지나 참고용이므로 실패해도 배포를 막지 않는다(`|| true`).
          # [2026-08-10 사고 1] 이 줄에 가드가 없어, 마이그레이션이 성공(condition met)한 뒤
          # `kubectl logs job/...`이 BadRequest로 죽으면서 set -e가 배포 전체를 중단시켰다.
          # Job 파드가 2개 이상이면(재시도 등) kubectl이 종료된 파드를 골라 이 오류를 낸다.
          kubectl logs job/wms-migrate-$SHORT --tail=20 --all-containers --ignore-errors 2>&1 || true

          # --- 애플리케이션 롤링 업데이트 ---
          # [2026-08-12] wms-beat이 이 목록에 없어 생성 당시 이미지에 영구 고정돼 있었다.
          # beat은 worker와 같은 app.worker.tasks 모듈을 로드하므로, 새 주기 태스크를
          # 추가해도 beat이 옛 코드면 스케줄 자체가 등록되지 않는다. 셋을 함께 올린다.
          kubectl set image deployment/wms-api       api=$REG/nexus-backend-repo:$SHA
          kubectl set image deployment/wms-ai-worker ai-worker=$REG/nexus-backend-repo:$SHA
          kubectl set image deployment/wms-beat      beat=$REG/nexus-backend-repo:$SHA

          # 노드 디스크가 20GB인데 이 이미지가 3.4GB라, 구·신 이미지가 함께 얹히면 pull 중
          # ephemeral-storage 축출 임계선을 스치며 워커가 축출된다(2026-08-12 실측: 가용
          # 2.98GB vs 임계 3.02GB). 셋을 같은 태그로 맞춰야 구 이미지를 회수할 수 있다.
          # 마이그레이션 Job이 같은 이미지를 이미 받아뒀다면 캐시가 살아 빠르지만, 다른
          # 노드에 스케줄되면 여기서 다시 pull 한다. 180초는 이 이미지 크기에 부족하다.
          # [2026-08-13] wms-ai-worker가 이 목록에서 빠져 있었다. set image는 하면서
          # 롤아웃 확인은 안 해, **하루 종일 교착에 빠졌던 바로 그 디플로이**가 못 떠도
          # 워크플로는 초록불이었다. beat만 `|| true`로 두는 이유는 Recreate 전략이라
          # 짧은 다운타임이 정상이기 때문이고, api·worker는 실패를 실패로 드러낸다.
          kubectl rollout status deployment/wms-api       --timeout=600s
          kubectl rollout status deployment/wms-ai-worker --timeout=600s
          kubectl rollout status deployment/wms-beat      --timeout=600s || true

          # --- 배포 검증 (실제로 반영됐는가) ---
          #
          # [2026-08-13 신설] 오늘 배포 3건이 "조용히" 실패했다. 빌드·ECR 푸시는 성공했는데
          # 클러스터는 옛 커밋에 멈춰 있었고, 그 사실을 사람이 "수정이 반영 안 된 느낌"으로
          # 알아챘다. set image를 쏘는 것과 그것이 실제로 반영되는 것은 다른 사건인데,
          # 파이프라인은 앞의 것만 하고 끝냈다.
          #
          # 실행 중인 파드의 이미지가 이번 SHA와 다르면 배포 실패로 확정한다.
          # spec이 아니라 **status(실제 구동 중인 컨테이너)**를 보는 것이 핵심이다 -
          # spec은 set image 직후 바뀌지만 파드는 안 떴을 수 있다.
          echo "--- 배포 검증: 실행 중 이미지가 $SHORT 인가 ---"
          VERIFY_FAILED=0
          for D in wms-api wms-ai-worker wms-beat; do
            RUNNING=$(kubectl get pods -l app=$D \
              -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.status.containerStatuses[0].image}{"\n"}{end}' 2>/dev/null \
              | sed 's|.*:||' | sort -u | tr '\n' ' ')
            if echo "$RUNNING" | grep -q "$SHA"; then
              echo "  OK   $D -> $SHORT"
            else
              echo "::error::$D 가 새 이미지로 뜨지 않았습니다 (실행 중: ${RUNNING:-없음} / 기대: $SHORT)"
              kubectl get pods -l app=$D 2>&1 | tail -5
              VERIFY_FAILED=1
            fi
          done
          if [ "$VERIFY_FAILED" != "0" ]; then
            echo "::error::배포 검증 실패 - 일부 구성요소가 구버전으로 남아 있습니다"
            exit 1
          fi
          echo "배포 검증 통과: api/worker/beat 모두 $SHORT"

          # --- 구 이미지 회수 ---
          # 노드 디스크 회수는 kubelet imageGC(imageGCHighThreshold 70% / Low 55%)에 맡긴다.
          # 여기서 노드로 직접 crictl을 쏘는 방법도 검토했으나, 배포 러너(마스터)에는 워커
          # 노드로 가는 SSH 키가 없어(2026-08-12 실측: Permission denied) 동작하지 않는다.
          # 세 디플로이가 같은 태그를 쓰면 노드에 백엔드 이미지는 최대 2세대만 남고,
          # 다음 배포가 70%를 넘기는 시점에 GC가 구세대를 회수해 자연히 평형을 이룬다.

    # --- 배포 실패 진단 (③ 실패 알림) ---
    #
    # [2026-08-13 신설] 오늘 배포 3건이 조용히 실패했고, 사람이 "수정이 반영 안 된 느낌"으로
    # 알아챘다. 실패 자체보다 **실패가 눈에 띄지 않은 것**이 문제였다.
    #
    # 두 갈래로 접근한다.
    #   (1) 노이즈 제거 — deploy-prod.yml이 매 푸시마다 찍어내던 실패 실행을 없앴다(ad4d0ca).
    #       이제 빨간 X는 진짜 실패만 뜻하므로 GitHub 기본 실패 알림이 신호로 기능한다.
    #   (2) 원인 즉시 노출 — 실패 시 로그를 파고들지 않아도 되도록, 클러스터 상태를
    #       실행 요약(Job Summary) 화면에 바로 적는다. 오늘 원인 규명에 실제로 필요했던
    #       것들(파드 상태/이미지 태그/최근 이벤트/노드 압박)을 그대로 담는다.
    - name: 배포 실패 진단 요약
      if: failure()
      continue-on-error: true
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ env.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "=== 파드 상태 ==="
          kubectl get pods -o wide 2>&1 | head -20
          echo ""
          echo "=== 디플로이별 목표 이미지 vs 실행 이미지 ==="
          for D in wms-api wms-ai-worker wms-beat; do
            SPEC=$(kubectl get deploy $D -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null | sed 's|.*:||' | cut -c1-12)
            RUN=$(kubectl get pods -l app=$D -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.status.containerStatuses[0].image}{"\n"}{end}' 2>/dev/null | sed 's|.*:||' | cut -c1-12 | sort -u | tr '\n' ' ')
            echo "$D: 목표=$SPEC 실행=${RUN:-없음}"
          done
          echo ""
          echo "=== 노드 압박 (디스크/메모리) ==="
          kubectl get nodes -o custom-columns='NODE:.metadata.name,DISK:.status.conditions[?(@.type=="DiskPressure")].status,MEM:.status.conditions[?(@.type=="MemoryPressure")].status' 2>&1
          echo ""
          echo "=== 최근 경고 이벤트 ==="
          kubectl get events --sort-by=.lastTimestamp --field-selector type=Warning 2>/dev/null | tail -10

    - name: 진단 결과를 실행 요약에 기록
      if: failure()
      continue-on-error: true
      run: |
        {
          echo "## 배포 실패"
          echo ""
          echo "커밋: \`${{ github.sha }}\`"
          echo ""
          echo "위 **배포 실패 진단 요약** 스텝의 출력에 파드 상태·이미지 태그·노드 압박·경고 이벤트가 있습니다."
          echo ""
          echo "### 자주 나온 원인 (40번 블루프린트 트러블슈팅 표 참조)"
          echo "- 노드 디스크 압박으로 마이그레이션 Job 파드가 축출 → Job Failed → 배포 중단"
          echo "- 롤링 교체 중 메모리 부족 교착 (단일 replica + maxSurge>0)"
          echo "- ECR 토큰 12시간 만료 → ImagePullBackOff"
          echo ""
          echo "빌드는 성공했는데 배포만 실패했는지 확인하려면 ECR에 태그가 있는지 보면 됩니다."
        } >> "$GITHUB_STEP_SUMMARY"
