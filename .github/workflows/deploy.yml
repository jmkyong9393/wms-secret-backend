name: Nexus Backend CI/CD (v3.1)
on:
  # 앱 산출물과 무관한 변경(문서·운영 워크플로)은 빌드하지 않는다.
  # 실측 2026-08-19: 워크플로 파일 수정 푸시가 풀 빌드를 19회 유발해 165분을 소비했다.
  # 운영 워크플로는 workflow_dispatch로 따로 실행하므로 배포가 필요 없다.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/cluster-*.yml'
      - '.github/workflows/deploy-lightsail.yml'
      - 'deploy/**'
  workflow_dispatch:        # 문서만 바꾼 뒤에도 수동 배포는 언제든 가능
permissions: { id-token: write, contents: read }

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 잡 레벨 env — 모든 스텝의 if:/with: 어디서든 동일하게 보장되어 참조되는 위치에
    # 따라 평가 시점이 갈리는 스텝 레벨 env 논쟁 자체를 없앤다.
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
    - name: Free runner disk space (Model Baking 이미지가 큼 — 기본 여유공간 부족으로 빌드 중 디스크 고갈)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        docker-images: false
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ap-northeast-2
    - id: ecr
      uses: aws-actions/amazon-ecr-login@v2
    - uses: docker/setup-buildx-action@v3

    - name: Build & Push Backend (api+worker 공용, Model Baked)
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ steps.ecr.outputs.registry }}/nexus-backend-repo:${{ github.sha }}
          ${{ steps.ecr.outputs.registry }}/nexus-backend-repo:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # ────────────────────────────────────────────────────────────────
    # [2026-09-01 컷오버] 여기 있던 "Deploy via SSH (Rolling Update)" 이하
    # k8s 배포 블록(마이그레이션 Job·kubectl set image·검증)은 클러스터 종료로 제거했다.
    # 원본 전체는 `k8s/deploy-k8s-workflow.yml.bak`에 보존 - 복귀 시 그대로 되살린다
    # (복귀 절차: k8s/RETURN.md).
    # 현행 배포: 이 워크플로는 ECR push까지만 하고,
    # Lightsail 반영은 `deploy-lightsail.yml`(workflow_dispatch)로 실행한다.
    # ────────────────────────────────────────────────────────────────
